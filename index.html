}

// ═══════════════ PLANNER FUNCTIONS ═══════════════
function addPlanFlower() {
  var sel = document.getElementById("planFlowerSelect");
  var inp = document.getElementById("planDemetInput");
  if (!sel || !inp || !sel.value || !inp.value) return;
  var name = sel.value;
  var demet = parseInt(inp.value) || 0;
  if (demet <= 0) return;
  // Check if already exists, update
  var existing = state.planFlowers.find(f => f.name === name);
  if (existing) existing.demet = demet;
  else state.planFlowers.push({ name: name, demet: demet });
  state.planResult = null;
  render();
}

function removePlanFlower(index) {
  state.planFlowers.splice(index, 1);
  state.planResult = null;
  render();
}

function togglePlanBranch(name) {
  var idx = state.planManualBranches.indexOf(name);
  if (idx >= 0) state.planManualBranches.splice(idx, 1);
  else state.planManualBranches.push(name);
  state.planResult = null;
  render();
}

function copyPlan() {
  if (state.planResult) {
    navigator.clipboard.writeText(state.planResult.replace(/\*\*/g, "")).then(function(){
      alert("Plan kopyalandı!");
    });
  }
}

function savePlan() {
  if (!state.planResult) return;
  var savedPlans = JSON.parse(localStorage.getItem("savedPlans") || "[]");

  // Öncelik: Kodun kendi hesapladığı tahmini kullan (daha güvenilir)
  // AI'nın yazdığı rakam brüt/net karışıklığına yol açıyor
  var estimatedNet = state.planCodeEstimate || 0;

  savedPlans.push({
    date: new Date().toISOString().split("T")[0],
    timestamp: Date.now(),
    flowers: state.planFlowers.map(function(f){return {name:f.name,demet:f.demet}}),
    boxSize: state.planBoxSize,
    strategy: state.planStrategy,
    result: state.planResult,
    estimatedNet: estimatedNet
  });
  localStorage.setItem("savedPlans", JSON.stringify(savedPlans));
  alert(estimatedNet > 0
    ? "Plan kaydedildi! Tahmini net: " + fmt(estimatedNet)
    : "Plan kaydedildi!");
  render();
}

function deletePlan(index) {
  var savedPlans = JSON.parse(localStorage.getItem("savedPlans") || "[]");
  if (confirm("Bu planı silmek istediğine emin misin?")) {
    savedPlans.splice(index, 1);
    localStorage.setItem("savedPlans", JSON.stringify(savedPlans));
    render();
  }
}

async function handlePlan() {
  if (state.planFlowers.length === 0 || state.planLoading) return;
  if (state.planBranchMode === "manual" && state.planManualBranches.length === 0) {
    alert("Manuel modda en az 1 şube seçmelisin!");
    return;
  }
  state.planLoading = true;
  state.planResult = null;
  render();

  var filtered = getFiltered();
  var stats = calcStats(filtered);
  var hd = getHeatData(filtered);

  // ── 2026 Recent data (last 14 days) for trends ──
  var last14 = new Date(); last14.setDate(last14.getDate() - 14);
  var last14str = last14.toISOString().split("T")[0];
  var recentData = ALL_DATA.filter(function(r){ return r.t >= last14str });

  // ── 2025 data for historical context ──
  var data2025 = ALL_DATA.filter(function(r){ return r.t.startsWith("2025") });

  var trendInfo = "\nSEÇİLİ DÖNEM: " + fD(state.sd) + " – " + fD(state.ed);

  // ── Per flower: price ranking + last 2 auction filter + 2025 data ──
  state.planFlowers.forEach(function(pf) {
    var flowerFiltered = filtered.filter(function(r){ return r.c === pf.name });
    var flowerRecent = recentData.filter(function(r){ return r.c === pf.name });
    var flower2025 = data2025.filter(function(r){ return r.c === pf.name });

    // Current period branch performance (genel ortalama)
    var byBranch = {};
    flowerFiltered.forEach(function(r){
      if(!byBranch[r.s]) byBranch[r.s] = {net:0,d:0};
      byBranch[r.s].net += r.net; byBranch[r.s].d += r.d;
    });

    // Genel ortalama (bu çiçeğin tüm şubelerdeki ortalaması)
    var totalNet = flowerFiltered.reduce(function(s,r){return s+r.net},0);
    var totalD = flowerFiltered.reduce(function(s,r){return s+r.d},0);
    var genelOrtalama = totalD > 0 ? totalNet / totalD : 0;

    // Son 2 mezat günü bul (bu çiçek için en son 2 farklı tarih)
    var uniqueDates = [...new Set(flowerRecent.map(function(r){return r.t}))].sort().reverse();
    var last2Dates = uniqueDates.slice(0, 2);

    // Son 2 mezattaki şube bazlı performans
    var last2ByBranch = {};
    flowerRecent.filter(function(r){ return last2Dates.includes(r.t) }).forEach(function(r){
      if(!last2ByBranch[r.s]) last2ByBranch[r.s] = {net:0,d:0};
      last2ByBranch[r.s].net += r.net; last2ByBranch[r.s].d += r.d;
    });

    // Recent daily trend per branch (14 gün)
    var dailyByBranch = {};
    flowerRecent.forEach(function(r){
      if(!dailyByBranch[r.s]) dailyByBranch[r.s] = {};
      if(!dailyByBranch[r.s][r.t]) dailyByBranch[r.s][r.t] = {net:0,d:0};
      dailyByBranch[r.s][r.t].net += r.net; dailyByBranch[r.s][r.t].d += r.d;
    });

    // 2025 branch data
    var branch2025 = {};
    flower2025.forEach(function(r){
      if(!branch2025[r.s]) branch2025[r.s] = {net:0,d:0};
      branch2025[r.s].net += r.net; branch2025[r.s].d += r.d;
    });

    // Build ranked list with status labels
    var branchRanked = Object.entries(byBranch).map(function(e){
      var avgDbn = e[1].d > 0 ? e[1].net / e[1].d : 0;

      // Trend hesapla
      var days = Object.entries(dailyByBranch[e[0]] || {}).sort(function(a,b){return a[0].localeCompare(b[0])});
      var trendPct = 0;
      if (days.length >= 2) {
        var fH = days.slice(0, Math.floor(days.length/2));
        var sH = days.slice(Math.floor(days.length/2));
        var fA = fH.reduce(function(s,d){return s+(d[1].d>0?d[1].net/d[1].d:0)},0) / fH.length;
        var sA = sH.reduce(function(s,d){return s+(d[1].d>0?d[1].net/d[1].d:0)},0) / sH.length;
        trendPct = fA > 0 ? ((sA - fA) / fA * 100) : 0;
      }

      // Son 2 mezat fiyatı
      var last2Data = last2ByBranch[e[0]];
      var last2Dbn = last2Data && last2Data.d > 0 ? last2Data.net / last2Data.d : null;

      // 2025 data
      var hist = branch2025[e[0]];
      var histDbn = hist && hist.d > 0 ? hist.net / hist.d : 0;

      // DURUM ETİKETİ BELİRLE — Stratejiye göre farklı eşikler
      var azaltEsik, gondermeEsik;
      if (state.planStrategy === "safe") {
        azaltEsik = -15;    // %15 altında → AZALT
        gondermeEsik = -30; // %30 altında → GÖNDERME
      } else if (state.planStrategy === "balanced") {
        azaltEsik = -25;    // %25 altında → AZALT
        gondermeEsik = -40; // %40 altında → GÖNDERME
      } else { // aggressive
        azaltEsik = -35;    // %35 altında → AZALT
        gondermeEsik = -50; // %50 altında → GÖNDERME
      }

      var status = "GÖNDER";
      var statusReason = "";

      if (last2Dbn !== null && genelOrtalama > 0) {
        var fark = ((last2Dbn - genelOrtalama) / genelOrtalama * 100);
        if (fark < gondermeEsik) {
          status = "GÖNDERME";
          statusReason = "Son 2 mezat ortalamanın %" + Math.abs(fark).toFixed(0) + " altında (eşik: %" + Math.abs(gondermeEsik) + ")";
        } else if (fark < azaltEsik) {
          status = "AZALT";
          statusReason = "Son 2 mezat ortalamanın %" + Math.abs(fark).toFixed(0) + " altında (eşik: %" + Math.abs(azaltEsik) + "), demet yarıya düşür";
        }
      } else if (last2Dbn === null) {
        // Son 2 mezat verisi yok → genel ortalamaya bak
        if (avgDbn > 0 && genelOrtalama > 0) {
          var genelFark = ((avgDbn - genelOrtalama) / genelOrtalama * 100);
          if (genelFark < gondermeEsik) {
            status = "GÖNDERME";
            statusReason = "Genel ortalama çok düşük";
          } else if (genelFark < azaltEsik) {
            status = "AZALT";
            statusReason = "Genel ortalama düşük";
          }
        }
        statusReason += (statusReason ? " | " : "") + "Son 2 mezat verisi yok, genel ortalamaya bakıldı";
      }

      return {name:e[0], dbn:avgDbn, d:e[1].d, trend:trendPct, histDbn:histDbn, last2Dbn:last2Dbn, status:status, statusReason:statusReason};
    }).sort(function(a,b){ return b.dbn - a.dbn });

    // Build info string
    var totalPrice = branchRanked.filter(function(b){return b.status!=="GÖNDERME"}).reduce(function(s,b){return s+b.dbn},0);

    trendInfo += "\n\n" + pf.name + " (" + pf.demet + " demet) — Genel ort: " + fmt(genelOrtalama) + "/dm";
    if (last2Dates.length > 0) trendInfo += " | Son 2 mezat: " + last2Dates.map(function(d){return fD(d)}).join(", ");

    trendInfo += "\n  ŞUBE ANALİZİ (yüksekten düşüğe):";
    branchRanked.forEach(function(b, idx) {
      var trendDir = b.trend > 3 ? "↑" : b.trend < -3 ? "↓" : "→";
      var histNote = b.histDbn > 0 ? " | 2025:" + fmt(b.histDbn) : "";
      var last2Note = b.last2Dbn !== null ? " | Son2mezat:" + fmt(b.last2Dbn) : " | Son2mezat:YOK";

      var statusIcon = b.status === "GÖNDER" ? "✅" : b.status === "AZALT" ? "⚠️" : "❌";

      // Yüzde önerisi (sadece GÖNDER ve AZALT olanlar için)
      var sugPct = 0;
      if (b.status !== "GÖNDERME" && totalPrice > 0) {
        sugPct = Math.round((b.dbn / totalPrice) * 100);
        if (b.status === "AZALT") sugPct = Math.round(sugPct * 0.5); // Azalt → yarıya düşür
      }

      trendInfo += "\n    " + statusIcon + " " + b.name + ": " + fmt(b.dbn) + "/dm (trend:" + trendDir + (b.trend>0?"+":"") + b.trend.toFixed(0) + "%" + last2Note + histNote + ")";
      if (b.status === "GÖNDERME") trendInfo += " → ❌ GÖNDERME: " + b.statusReason;
      else if (b.status === "AZALT") trendInfo += " → ⚠️ AZALT (%" + sugPct + "): " + b.statusReason;
      else trendInfo += " → ÖNERİ: %" + sugPct;
    });

    // 2025 branches NOT in current data (for explore mode)
    if (state.planBranchMode === "explore") {
      var currentBranches = branchRanked.map(function(b){return b.name});
      var potentialBranches = Object.entries(branch2025).filter(function(e){
        return !currentBranches.includes(e[0]) && e[1].d > 0;
      }).map(function(e){
        return {name:e[0], dbn:e[1].d > 0 ? e[1].net / e[1].d : 0, d:e[1].d};
      }).sort(function(a,b){return b.dbn - a.dbn});

      if (potentialBranches.length > 0) {
        trendInfo += "\n  🔍 DENEME POTANSİYELİ (2025'te var, 2026'da yok):";
        potentialBranches.slice(0,5).forEach(function(b){
          trendInfo += "\n    ⭐ " + b.name + ": 2025'te " + fmt(b.dbn) + "/dm (" + b.d + "dm)";
        });
      }

      var lowVolume = branchRanked.filter(function(b){ return b.d <= 5 && b.dbn > 0 && b.status !== "GÖNDERME" });
      if (lowVolume.length > 0) {
        trendInfo += "\n  🔍 AZ DENENMİŞ AMA İYİ FİYAT:";
        lowVolume.forEach(function(b){
          trendInfo += "\n    ⭐ " + b.name + ": " + fmt(b.dbn) + "/dm (sadece " + b.d + "dm)";
        });
      }
    }
  });

  // ── Branch mode specific instructions ──
  var branchModeText = "";
  if (state.planBranchMode === "auto") {
    branchModeText = "\n\nŞUBE SEÇİM MODU: OTOMATİK\n" +
      "Tüm şubelere kutu yapmak ZORUNDA DEĞİLSİN. Sadece kârlı olan şubeleri seç.\n" +
      "Kural: En fazla 5-7 şubeye gönder. Fiyatı çok düşük olan şubeleri ATLA.\n" +
      "Bir şubeye kutu yapmak için o şubenin dm başı net fiyatının, ortalama fiyatın en az %60'ı kadar olması gerekir.";
  } else if (state.planBranchMode === "manual") {
    branchModeText = "\n\nŞUBE SEÇİM MODU: MANUEL\n" +
      "SADECE şu şubelere kutu yap, başka şubeye YAPMA: " + state.planManualBranches.join(", ") + "\n" +
      "Bu şubeler arasında fiyat sıralamasına göre dağıt. En pahalıya en çok.";
  } else if (state.planBranchMode === "explore") {
    branchModeText = "\n\nŞUBE SEÇİM MODU: DENEME\n" +
      "Ana dağılımı kârlı şubelere yap (toplam demetin %85-90'ı).\n" +
      "Kalan %10-15'i DENEME şubelerine ayır (2025'te iyi fiyat vermiş ama 2026'da az/hiç gönderilmemiş şubeler).\n" +
      "Deneme şubelerine MAX 1-2 kutu. 2025 verilerinde iyi fiyat veren şubeleri tercih et.\n" +
      "Deneme kutularını açıkça '🔍 DENEME' olarak işaretle ve nedenini 2025 verisiyle açıkla.";
  }

  // ── 2025 overall context ──
  var hist2025Text = "";
  if (data2025.length > 0) {
    var hist25ByF = {};
    data2025.forEach(function(r){
      if(!hist25ByF[r.c]) hist25ByF[r.c]={net:0,d:0};
      hist25ByF[r.c].net+=r.net; hist25ByF[r.c].d+=r.d;
    });
    hist2025Text = "\n\n2025 GEÇMİŞ VERİ (referans — %20 ağırlık ver, %80 güncel veriye bak):\n";
    hist2025Text += Object.entries(hist25ByF).map(function(e){
      return e[0] + ": " + fmt(e[1].d>0?e[1].net/e[1].d:0) + "/dm, " + e[1].d + "dm";
    }).join("; ");
  }

  var strategyDesc = {
    safe: "GÜVENLİ STRATEJİ:\n" +
      "• Filtre: Son 2 mezat ortalamanın %15+ altı → AZALT, %30+ altı → GÖNDERME\n" +
      "• Şube sayısı: MAX 4-5 şube. Az ama emin olduğun yerlere.\n" +
      "• Dağılım: 1.şube %40-45, 2.şube %25-30, 3.şube %15-20, geri kalan %5-10\n" +
      "• Karar mantığı: MUTLAK FİYAT ağırlıklı. Trend'e çok bakma. Geçmişte kanıtlanmış, yeterli veri olan şubelere gönder.\n" +
      "• Felsefe: Az kazanayım ama kayıp riskim düşük olsun.",
    balanced: "DENGELİ STRATEJİ:\n" +
      "• Filtre: Son 2 mezat ortalamanın %25+ altı → AZALT, %40+ altı → GÖNDERME\n" +
      "• Şube sayısı: 5-8 şube. Daha geniş yay ama hâlâ kontrollü.\n" +
      "• Dağılım: 1.şube %30-35, 2.şube %20-25, 3.şube %15-20, 4-5.şube %10-15, kalan %5-10\n" +
      "• Karar mantığı: Fiyat %60 ağırlık + Trend %40 ağırlık. İkisini dengele.\n" +
      "• Felsefe: Makul risk, makul kazanç. Normal dağılım.",
    aggressive: "AGRESİF STRATEJİ:\n" +
      "• Filtre: Son 2 mezat ortalamanın %35+ altı → AZALT, %50+ altı → GÖNDERME\n" +
      "• Şube sayısı: 6-10 şube. Geniş dağılım.\n" +
      "• Dağılım: 1.şube %25-30, 2.şube %20-25, 3.şube %15-20, kalan şubeler %5-15 paylaşır (daha eşit dağılım)\n" +
      "• Karar mantığı: Trend %60 ağırlık + Fiyat %40 ağırlık. Trendi YÜKSELEN şubelere ekstra şans ver. Fiyatı düşük ama hızla yükselen bir şube varsa güvenli modda görmezden gelinecek o şubeye de kutu yap.\n" +
      "• Felsefe: Maksimum kazanç hedefle. Momentum yakala. Kayıp olabilir ama yukarı potansiyel büyük."
  };

  var totalDemet = state.planFlowers.reduce(function(s,f){return s+f.demet},0);
  var totalKutu = Math.ceil(totalDemet / state.planBoxSize);

  var planPrompt = "GÖREV: Çiçek gönderim planı oluştur.\n\n" +
    "KESİLEN ÇİÇEKLER:\n" + state.planFlowers.map(function(f){ return "- " + f.name + ": " + f.demet + " demet" }).join("\n") +
    "\nTOPLAM: " + totalDemet + " demet, " + totalKutu + " kutu (" + state.planBoxSize + " dm/kutu)" +
    "\n\nSTRATEJİ: " + strategyDesc[state.planStrategy] +
    branchModeText +
    "\n\nGÜNCEL VERİLER:" + trendInfo +
    "\n\nKombo sıralaması: " + hd.slice(0,25).map(function(h){return h.cicek+"→"+h.sube+":"+fmt(h.dbn)+"/dm"}).join("; ") +
    hist2025Text +
    "\n\n🚨 ZORUNLU KURALLAR:\n" +
    "1. ❌ GÖNDERME etiketli çiçek-şube kombinasyonlarına KESİNLİKLE kutu yapma!\n" +
    "2. ⚠️ AZALT etiketli kombinasyonlara önerilen yüzdenin YARISINI ver.\n" +
    "3. ✅ GÖNDER etiketli kombinasyonlara önerilen yüzdeye göre dağıt.\n" +
    "4. EN PAHALI şubeye EN ÇOK kutu!\n" +
    "5. 🚨🚨🚨 HER ÇİÇEĞİN TOPLAM DEMETİ GİRİLEN MİKTARA BİREBİR EŞİT OLMALI! KALAN DEMET BIRAKMAK YASAK! Eğer kutulara tam sığmıyorsa son kutuyu eksik doldur veya en iyi şubeye ekstra kutu yap. Hiçbir demet boşta kalamaz!\n" +
    "6. Kutu başına " + state.planBoxSize + " demet. Karışık çiçek konulabilir. Son kutu tam dolmak zorunda DEĞİL.\n" +
    "7. UCUZ şubeye PAHALI şubeden fazla kutu YASAK!\n" +
    "8. 2025 verisi referans (%20 ağırlık), güncel veri ana karar (%80).\n" +
    "9. Tüm şubelere kutu yapmak ZORUNLU DEĞİL.\n" +
    "10. DAĞILIM DETAYI bölümünde her çiçeğin şubelere dağılımını yaz ve TOPLAMI KONTROL ET. Toplam girilen demete eşit değilse DÜZELT!\n" +
    "\nÇIKTI FORMATI:\n" +
    "📦 [ŞUBE] - [KUTU] kutu\n" +
    "  Kutu X: [DM] dm [ÇİÇEK] (fiyat: X₺/dm, son2mezat: X₺, trend: +Y%)\n" +
    (state.planBranchMode==="explore" ? "  🔍 DENEME kutularını ayrı belirt\n" : "") +
    "\n📊 ÖZET (ZORUNLU — bu bölümü MUTLAKA yaz):\n" +
    "- Toplam: X kutu (Y demet)\n" +
    "- Dağılım: şube1 %X, şube2 %Y...\n" +
    "- TAHMİNİ NET GELİR: XXXXX ₺\n" +
    "  (Hesaplama: Her şubeye giden demet × o çiçeğin o şubedeki dm başı net fiyat, toplamı al)\n" +
    "- Risk notu\n" +
    "- Elenen şubeler ve nedenleri";

  try {
    var resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: "Sen çiçek mezat lojistik uzmanısın. Yalova'da üretici, Flora mezatına gönderiyor. Gider %20. Türkçe.\n\n" +
          "EN ÖNEMLİ KURAL: ❌ GÖNDERME etiketli kombinasyonlara KESİNLİKLE kutu yapma!\n" +
          "⚠️ AZALT etiketlilere yarı pay ver. ✅ GÖNDER etiketlilere normal dağıt.\n" +
          "Tüm şubelere kutu yapmak ZORUNLU DEĞİL. 2025 verisi %20 ağırlık.\n" +
          "Her kutuya " + state.planBoxSize + " demet, karışık çiçek olabilir. Kesin sayılar ver.\n\n" +
          (state.planStrategy === "safe" ?
            "STRATEJİ DAVRANIŞI — GÜVENLİ:\n" +
            "• Max 4-5 şubeye gönder. Sadece kanıtlanmış yerlere.\n" +
            "• MUTLAK FİYAT ağırlıklı karar ver. Trend'e fazla bakma.\n" +
            "• 1.şubeye %40-45, 2.şubeye %25-30, geri kalana az.\n" +
            "• Az kazanayım ama kayıp olmasın mantığı.\n" +
            "• Ucuz şubeye pahalıdan fazla kutu YASAK." :
          state.planStrategy === "balanced" ?
            "STRATEJİ DAVRANIŞI — DENGELİ:\n" +
            "• 5-8 şubeye gönder. Geniş ama kontrollü.\n" +
            "• Fiyat %60 + Trend %40 ağırlıkla karar ver.\n" +
            "• 1.şubeye %30-35, 2.şubeye %20-25, daha eşit yay.\n" +
            "• Makul risk, makul kazanç.\n" +
            "• Ucuz şubeye pahalıdan fazla kutu YASAK." :
            "STRATEJİ DAVRANIŞI — AGRESİF:\n" +
            "• 6-10 şubeye gönder. Geniş dağılım.\n" +
            "• Trend %60 + Fiyat %40 ağırlıkla karar ver.\n" +
            "• Daha eşit dağılım: 1.şubeye %25-30, diğerleri %10-20.\n" +
            "• Trendi YÜKSELEN şubelere ekstra şans ver — fiyatı düşük ama hızla yükselen şubeye de kutu yap.\n" +
            "• Maksimum kazanç hedefle, risk tolere et."),
        messages: [{ role: "user", content: planPrompt }]
      })
    });
    var data = await resp.json();
    if (data.content && data.content.length > 0) {
      state.planResult = data.content.map(function(b){ return b.text || "" }).join("\n");
    } else if (data.error) {
      state.planResult = "⚠ Hata: " + (data.error.message || JSON.stringify(data.error));
    } else {
      state.planResult = generateLocalPlan();
    }
  } catch(e) {
    state.planResult = generateLocalPlan();
  }

  // Kod tarafında kendi tahmini net gelir hesaplamamız — trend düzeltmeli
  if (state.planResult && !state.planResult.startsWith("⚠")) {
    var codeEstimate = 0;
    var last14 = new Date(); last14.setDate(last14.getDate() - 14);
    var last14str = last14.toISOString().split("T")[0];

    state.planFlowers.forEach(function(pf){
      var flowerData = filtered.filter(function(r){ return r.c === pf.name });
      var flowerRecent = ALL_DATA.filter(function(r){ return r.c === pf.name && r.t >= last14str });

      var byBr = {};
      flowerData.forEach(function(r){
        if(!byBr[r.s]) byBr[r.s] = {net:0,d:0};
        byBr[r.s].net += r.net; byBr[r.s].d += r.d;
      });

      var brList = Object.entries(byBr).map(function(e){
        var avgDbn = e[1].d > 0 ? e[1].net / e[1].d : 0;

        // Son 2 mezat gününü bul (bu çiçek × bu şube)
        var brRecent = flowerRecent.filter(function(r){ return r.s === e[0] });
        var uniqueDays = [...new Set(brRecent.map(function(r){return r.t}))].sort().reverse();
        var last2Days = uniqueDays.slice(0, 2);
        var last2Records = brRecent.filter(function(r){ return last2Days.includes(r.t) });
        var last2Net = last2Records.reduce(function(s,r){return s+r.net},0);
        var last2D = last2Records.reduce(function(s,r){return s+r.d},0);
        var last2Dbn = last2D > 0 ? last2Net / last2D : null;

        // Trend düzeltmeli fiyat: %70 son 2 mezat + %30 genel ortalama
        var trendAdjustedPrice;
        if (last2Dbn !== null && last2Dbn > 0) {
          trendAdjustedPrice = last2Dbn * 0.7 + avgDbn * 0.3;
        } else {
          trendAdjustedPrice = avgDbn; // Son 2 mezat yoksa ortalamayı kullan
        }

        return {name:e[0], dbn:avgDbn, adjustedDbn:trendAdjustedPrice, last2Dbn:last2Dbn};
      }).sort(function(a,b){return b.adjustedDbn - a.adjustedDbn});

      // Fiyata orantılı ağırlıklı dağılım (trend düzeltmeli fiyatla)
      if (brList.length > 0) {
        var totalAdj = brList.reduce(function(s,b){return s+b.adjustedDbn},0);
        var remaining = pf.demet;
        brList.forEach(function(b, idx){
          var share = totalAdj > 0 ? (b.adjustedDbn / totalAdj) : (1 / brList.length);
          var demetForBranch = idx < brList.length - 1 ? Math.round(pf.demet * share) : remaining;
          demetForBranch = Math.min(demetForBranch, remaining);
          codeEstimate += b.adjustedDbn * demetForBranch;
          remaining -= demetForBranch;
        });
      }
    });
    if (codeEstimate > 0) {
      state.planCodeEstimate = codeEstimate;
    }
  }

  state.planLoading = false;
  render();
}

function generateLocalPlan() {
  var plan = "📦 GÖNDERİM PLANI (Yerel Analiz)\n\n";
  var hd = getHeatData(getFiltered());

  state.planFlowers.forEach(function(pf) {
    var combos = hd.filter(function(h){ return h.cicek === pf.name }).slice(0, 5);
    var remaining = pf.demet;
    plan += "**" + pf.name + "** (" + pf.demet + " demet):\n";
    combos.forEach(function(c) {
      if (remaining <= 0) return;
      var boxes = Math.min(Math.ceil(remaining / state.planBoxSize), 2);
      var dm = Math.min(boxes * state.planBoxSize, remaining);
      plan += "  📦 " + c.sube + ": " + boxes + " kutu (" + dm + " dm) — " + fmt(c.dbn) + "/dm\n";
      remaining -= dm;
    });
    if (remaining > 0) plan += "  📦 Diğer: " + Math.ceil(remaining / state.planBoxSize) + " kutu (" + remaining + " dm)\n";
    plan += "\n";
  });

  plan += "Not: Bu yerel analiz. API bağlantısı olduğunda daha detaylı plan alabilirsin.";
  return plan;
}

function setPreset(p) {
  const today = new Date().toISOString().split("T")[0];
  const year = today.substring(0, 4);
  const month = today.substring(0, 7);
  if (p === "today") setState({ sd: today, ed: today });
  else if (p === "week") {
    const d = new Date(); d.setDate(d.getDate() - 6);
    setState({ sd: d.toISOString().split("T")[0], ed: today });
  }
  else if (p === "month") setState({ sd: month + "-01", ed: today });
  else if (p === "all") setState({ sd: year + "-01-01", ed: today });
}

function toggleExp(key) {
  state.expanded[key] = !state.expanded[key];
  render();
}

function generateReportText() {
  const filtered = getFiltered();
  const rData = getPDFReportData(filtered);
  const stats = rData.stats;
  const dateLabel = state.sd !== state.ed ? fD(state.sd) + " – " + fD(state.ed) : fDF(state.sd);

  let text = "🌸 ÇALLI ÇİÇEK — HAFTALIK RAPOR\n";
  text += "📅 " + dateLabel + "\n\n";
  text += "💰 Net Gelir: " + fmt(stats.tn) + "\n";
  text += "📦 Demet: " + stats.td + "\n";
  text += "📊 Ort. Fiyat: " + fmt2(stats.av) + "/dm\n";

  if (rData.hasPrev && rData.prevTotalNet > 0) {
    const ch = ((stats.tn - rData.prevTotalNet) / rData.prevTotalNet * 100);
    text += "📈 Önceki döneme göre: " + (ch > 0 ? "+" : "") + ch.toFixed(1) + "%\n";
  }

  text += "\n🏆 EN KÂRLI 5 ÇİÇEK:\n";
  stats.byF.slice(0, 5).forEach((f, i) => {
    text += (i + 1) + ". " + f.name + " — " + fmt(f.dbn) + "/dm (" + f.d + " dm)\n";
  });

  text += "\n📍 ŞUBE DETAYLARI:\n";
  rData.branchList.forEach((b, i) => {
    text += "\n" + (i + 1) + ". " + b.name + " — " + fmt(b.net) + " net (" + b.d + " dm)";
    if (b.netChange != null) text += " [" + (b.netChange > 0 ? "+" : "") + b.netChange.toFixed(0) + "%]";
    text += "\n";
    b.flowers.slice(0, 5).forEach(fl => {
      text += "   " + fl.name + ": " + fl.d + "dm · " + fmt(fl.dbn) + "/dm";
      if (fl.dbnChange != null) text += " (" + (fl.dbnChange > 0 ? "+" : "") + fl.dbnChange.toFixed(0) + "%)";
      text += "\n";
    });
  });

  return text;
}

function copyReportText() {
  const text = generateReportText();
  navigator.clipboard.writeText(text).then(() => {
    alert("Rapor kopyalandı! WhatsApp'a yapıştırabilirsin.");
  }).catch(() => {
    // Fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("Rapor kopyalandı!");
  });
}

  // ═══ ŞUBE DETAYLI PERFORMANS (YENİ) ═══

      if (b.netChange != null) pdfHTML += ` <span class="cb ${b.netChange>0?'cu':'cd'}">${b.netChange>0?'+':''}${b.netChange.toFixed(1)}%</span>`;
      pdfHTML += ` &nbsp;|&nbsp; Dm Başı: ${fmt(b.prevDbn)} → ${fmt(b.dbn)}`;
      if (b.dbnChange != null) pdfHTML += ` <span class="cb ${b.dbnChange>0?'cu':'cd'}">${b.dbnChange>0?'+':''}${b.dbnChange.toFixed(1)}%</span>`;
      pdfHTML += `</div>`;
    }

    // Çiçek detay tablosu
    if (b.flowers.length > 0) {
      pdfHTML += `<table><thead><tr><th>Çiçek</th><th class="right">Demet</th><th class="right">Dm Başı Net</th>`;
      if (rData.hasPrev) pdfHTML += `<th class="right">Önceki</th><th class="right">Değişim</th>`;
      pdfHTML += `<th class="right">Net Gelir</th></tr></thead><tbody>`;
      b.flowers.forEach(fl => {
        pdfHTML += `<tr><td class="bold">${fl.name}</td><td class="right">${fl.d}</td><td class="right green bold">${fmt(fl.dbn)}</td>`;
        if (rData.hasPrev) {
          pdfHTML += `<td class="right grey">${fl.prevDbn > 0 ? fmt(fl.prevDbn) : '—'}</td>`;
          pdfHTML += `<td class="right">`;
          if (fl.dbnChange != null) pdfHTML += `<span class="cb ${fl.dbnChange>0?'cu':'cd'}">${fl.dbnChange>0?'+':''}${fl.dbnChange.toFixed(1)}%</span>`;
          else pdfHTML += `<span class="grey">—</span>`;
          pdfHTML += `</td>`;
        }
        pdfHTML += `<td class="right">${fmt(fl.net)}</td></tr>`;
      });
      // Branch total row
      pdfHTML += `<tr style="border-top:2px solid #ddd;background:#f0fdf4"><td class="bold">TOPLAM</td><td class="right bold">${b.d}</td><td class="right green bold">${fmt(b.dbn)}</td>`;
      if (rData.hasPrev) { pdfHTML += `<td class="right grey">${b.prevDbn > 0 ? fmt(b.prevDbn) : '—'}</td><td class="right">`; if (b.dbnChange != null) pdfHTML += `<span class="cb ${b.dbnChange>0?'cu':'cd'}">${b.dbnChange>0?'+':''}${b.dbnChange.toFixed(1)}%</span>`; pdfHTML += `</td>`; }
      pdfHTML += `<td class="right bold green">${fmt(b.net)}</td></tr></tbody></table>`;
    }
    pdfHTML += `</div>`;
  });

  pdfHTML += `<div class="footer">Çallı Çiçek Üretici Paneli · ${new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`;
  pdfHTML += `</body></html>`;

  // Open in new window for printing/saving as PDF
  const w = window.open("", "_blank");
  w.document.write(pdfHTML);
  w.document.close();
  setTimeout(() => w.print(), 500);
}

function setAIQ(q) {
  state.aiQ = q;
  render();
}

async function handleAI() {
  const q = state.aiQ.trim();
  if (!q) return;
  state.aiH.push({ r: "u", t: q });
  state.aiQ = "";
  state.aiL = true;
  render();

  const filtered = getFiltered();
  const stats = calcStats(filtered);
  const hd = getHeatData(filtered);
  const bc = getBranchComp(filtered);
  const yoy = getYoY(filtered);

  const ctx = "VERİ (" + fD(state.sd) + "-" + fD(state.ed) + "): Ciro:" + fmt(stats.tc) + ", Net:" + fmt(stats.tn) + ", " + stats.td + "dm, Ort:" + fmt2(stats.av) +
    "\nÇiçek(dbn sıralı): " + stats.byF.slice(0, 12).map(f => f.name + ":" + fmt(f.dbn) + "/dm," + f.d + "dm," + fmt(f.net) + "net").join("; ") +
    "\nŞube(net sıralı): " + stats.byB.slice(0, 12).map(b => b.name + ":" + fmt(b.net) + "net," + b.d + "dm," + fmt(b.dbn) + "/dm").join("; ") +
    "\nTopKombo(dbn sıralı): " + hd.slice(0, 12).map(h => h.cicek + "→" + h.sube + ":" + fmt(h.dbn) + "/dm," + h.d + "dm").join("; ") +
    "\nGünlük: " + stats.dl.map(d => fD(d.date) + "(" + ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"][new Date(d.date+"T00:00:00").getDay()] + "):" + fmt(d.avgP) + "ort," + d.d + "dm," + fmt(d.net) + "net").join("; ") +
    (function(){
      // Per-flower daily breakdown for top 5 flowers
      var detail = "";
      stats.byF.slice(0,5).forEach(function(f){
        var dayMap = {};
        filtered.filter(function(r){return r.c===f.name}).forEach(function(r){
          if(!dayMap[r.t]) dayMap[r.t]={net:0,d:0};
          dayMap[r.t].net+=r.net; dayMap[r.t].d+=r.d;
        });
        var days = Object.entries(dayMap).sort(function(a,b){return a[0].localeCompare(b[0])}).map(function(e){
          return fD(e[0])+":"+fmt(e[1].d>0?e[1].net/e[1].d:0)+"/dm,"+e[1].d+"dm";
        });
        if(days.length>1) detail += "\n" + f.name + " günlük: " + days.join("; ");
      });
      return detail;
    })() +
    "\nGeçenYıl: " + (yoy.has ? "2025net:" + fmt(yoy.lN) + "," + yoy.lD + "dm,ort" + fmt(yoy.lA) + " → 2026net:" + fmt(yoy.tN) + "," + yoy.tD + "dm,ort" + fmt(yoy.tA) + " değişim:" + (yoy.nCh>0?"+":"") + (yoy.nCh?.toFixed(1)||"—") + "%" : "geçen yıl verisi yok") +
    (function(){
      // Detailed 2025 data
      var data2025 = ALL_DATA.filter(function(r){ return r.t.startsWith("2025") });
      if (data2025.length === 0) return "";
      var detail = "\n\n=== 2025 DETAYLI VERİ ===";
      // 2025 flower breakdown
      var fm = {};
      data2025.forEach(function(r){
        if(!fm[r.c]) fm[r.c]={net:0,d:0};
        fm[r.c].net+=r.net; fm[r.c].d+=r.d;
      });
      var fList = Object.entries(fm).map(function(e){return {name:e[0],net:e[1].net,d:e[1].d,dbn:e[1].d>0?e[1].net/e[1].d:0}}).sort(function(a,b){return b.dbn-a.dbn});
      detail += "\n2025 Çiçek(dbn sıralı): " + fList.slice(0,12).map(function(f){return f.name+":"+fmt(f.dbn)+"/dm,"+f.d+"dm,"+fmt(f.net)+"net"}).join("; ");
      // 2025 branch breakdown
      var bm = {};
      data2025.forEach(function(r){
        if(!bm[r.s]) bm[r.s]={net:0,d:0};
        bm[r.s].net+=r.net; bm[r.s].d+=r.d;
      });
      var bList = Object.entries(bm).map(function(e){return {name:e[0],net:e[1].net,d:e[1].d,dbn:e[1].d>0?e[1].net/e[1].d:0}}).sort(function(a,b){return b.net-a.net});
      detail += "\n2025 Şube(net sıralı): " + bList.slice(0,12).map(function(b){return b.name+":"+fmt(b.net)+"net,"+b.d+"dm,"+fmt(b.dbn)+"/dm"}).join("; ");
      // 2025 monthly breakdown
      var mm = {};
      data2025.forEach(function(r){
        var m = r.t.substring(0,7);
        if(!mm[m]) mm[m]={net:0,d:0};
        mm[m].net+=r.net; mm[m].d+=r.d;
      });
      var mList = Object.entries(mm).sort(function(a,b){return a[0].localeCompare(b[0])}).map(function(e){return e[0]+":"+fmt(e[1].net)+"net,"+e[1].d+"dm,ort"+fmt(e[1].d>0?e[1].net/e[1].d:0)+"/dm"});
      detail += "\n2025 Aylık: " + mList.join("; ");
      // Per-flower YoY comparison
      detail += "\nÇiçek YoY Karşılaştırma: ";
      var now2026 = {};
      filtered.forEach(function(r){if(!now2026[r.c])now2026[r.c]={net:0,d:0};now2026[r.c].net+=r.net;now2026[r.c].d+=r.d});
      var compItems = [];
      fList.forEach(function(f25){
        var f26 = now2026[f25.name];
        if(f26 && f26.d>0){
          var dbn25 = f25.dbn;
          var dbn26 = f26.net/f26.d;
          var ch = dbn25>0?((dbn26-dbn25)/dbn25*100):0;
          compItems.push(f25.name+": 2025="+fmt(dbn25)+"/dm → 2026="+fmt(dbn26)+"/dm ("+(ch>0?"+":"")+ch.toFixed(0)+"%)");
        }
      });
      if(compItems.length>0) detail += compItems.slice(0,10).join("; ");
      return detail;
    })();

  try {
    const systemPrompt = "Sen bir çiçek mezat analisti ve danışmanısın. Kullanıcı Yalova'da çiçek üreticisi — Flora mezatına (Hollanda tipi açık artırma) çiçek gönderiyor. Türkçe cevap ver. Kısa, net ve aksiyon odaklı ol. Sayıları ve TL değerlerini kullan. Somut önerilerde bulun. Gider oranı %20 sabit.\n\nVERİLER:\n" + ctx;
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: systemPrompt,
        messages: [{ role: "user", content: q }]
      })
    });
    const data = await resp.json();
    if (data.error) {
      state.aiH.push({ r: "a", t: "⚠ API Hatası: " + (data.error.message || data.error) + "\n\nYerel analiz:\n" + localAnswer(q, stats, bc, hd, yoy) });
    } else if (data.content && data.content.length > 0) {
      const ans = data.content.map(b => b.text || "").join("\n");
      state.aiH.push({ r: "a", t: ans || localAnswer(q, stats, bc, hd, yoy) });
    } else {
      state.aiH.push({ r: "a", t: localAnswer(q, stats, bc, hd, yoy) });
    }
  } catch (e) {
    state.aiH.push({ r: "a", t: "⚠ Bağlantı hatası. Yerel analiz:\n\n" + localAnswer(q, stats, bc, hd, yoy) });
  }
  state.aiL = false;
  render();
}

function localAnswer(q, stats, bc, hd, yoy) {
  const ql = q.toLowerCase();
  if (ql.includes("kombo") || ql.includes("kârlı") || ql.includes("karli"))
    return "En Kârlı 5 Kombinasyon:\n" + hd.slice(0, 5).map((h, i) => (i + 1) + ". " + h.cicek + " → " + h.sube + ": " + fmt(h.dbn) + "/dm (" + h.d + "dm)").join("\n");
  if (ql.includes("şube") || ql.includes("nereye") || ql.includes("göndermeli") || ql.includes("gonder"))
    return bc.slice(0, 5).map(c => c.flower + ":\n" + c.branches.slice(0, 3).map((b, i) => "  " + (i === 0 ? "🏆" : " ") + " " + b.name + ": " + fmt(b.avgP) + " (" + b.d + "dm)").join("\n")).join("\n\n");
  if (ql.includes("özetle") || ql.includes("özet") || ql.includes("hafta") || ql.includes("durum"))
    return "Dönem Özeti:\n• Net Gelir: " + fmt(stats.tn) + "\n• " + stats.td + " demet | Ort: " + fmt2(stats.av) + "/dm\n\nEn kârlı 3 çiçek:\n" + stats.byF.slice(0,3).map((f,i)=>(i+1)+". "+f.name+" — "+fmt(f.dbn)+"/dm ("+f.d+"dm)").join("\n") + "\n\nEn iyi 3 şube:\n" + stats.byB.slice(0,3).map((b,i)=>(i+1)+". "+b.name+" — "+fmt(b.net)+" net").join("\n");
  if (ql.includes("trend") || ql.includes("fiyat") || ql.includes("yüksel") || ql.includes("düş")) {
    if (stats.dl.length < 2) return "En az 2 gün seç.";
    const f = stats.dl[0], l = stats.dl[stats.dl.length - 1];
    const ch = f.avgP > 0 ? ((l.avgP - f.avgP) / f.avgP * 100) : 0;
    return "Fiyat Trendi:\n" + fD(f.date) + ": " + fmt(f.avgP) + " → " + fD(l.date) + ": " + fmt(l.avgP) + "\nDeğişim: " + (ch > 0 ? "+" : "") + ch.toFixed(1) + "%\n\nEn çok yükselen:\n" + stats.byF.filter(x=>x.dbn>0).slice(0,3).map(x=>x.name+" — "+fmt(x.dbn)+"/dm").join("\n");
  }
  if (ql.includes("geçen yıl") || ql.includes("2025") || ql.includes("karşılaştır"))
    return yoy.has ? "Geçen Yıl Karşılaştırması:\n2025: " + fmt(yoy.lN) + " net (" + yoy.lD + "dm, " + fmt(yoy.lA) + "/dm)\n2026: " + fmt(yoy.tN) + " net (" + yoy.tD + "dm, " + fmt(yoy.tA) + "/dm)\n\nNet Gelir: " + (yoy.nCh>0?"+":"") + (yoy.nCh?.toFixed(1)||"—") + "%\nDm Başı: " + (yoy.pCh>0?"+":"") + (yoy.pCh?.toFixed(1)||"—") + "%" : "Geçen yıl verisi yok.";
  if (ql.includes("bırak") || ql.includes("kötü") || ql.includes("kazandırmıyor") || ql.includes("düşük"))
    return "En Düşük Performans:\n" + stats.byF.slice(-3).reverse().map((f,i)=>(i+1)+". "+f.name+" — "+fmt(f.dbn)+"/dm ("+f.d+"dm, "+fmt(f.net)+" net)").join("\n") + "\n\nBu çiçeklerin demet başı net geliri düşük. Üretimi azaltmayı veya daha iyi şubelere yönlendirmeyi düşün.";
  if (ql.includes("artır") || ql.includes("üretim") || ql.includes("yapmalıyım") || ql.includes("öneri"))
    return "Öneriler:\n\n📈 Artır:\n" + stats.byF.slice(0,3).map((f,i)=>(i+1)+". "+f.name+" — "+fmt(f.dbn)+"/dm, güçlü performans").join("\n") + "\n\n📉 Azalt/Değiştir:\n" + stats.byF.slice(-2).map(f=>"• "+f.name+" — "+fmt(f.dbn)+"/dm, düşük getiri").join("\n") + "\n\n📍 En iyi şubeler:\n" + stats.byB.slice(0,3).map(b=>"• "+b.name+" — "+fmt(b.net)+" net").join("\n");
  if (ql.includes("gün") || ql.includes("pazartesi") || ql.includes("salı") || ql.includes("hangi gün")) {
    const gunler = {};
    getFiltered().forEach(r => {
      const d = new Date(r.t + "T00:00:00");
      const gun = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"][d.getDay()];
      if (!gunler[gun]) gunler[gun] = {net:0,d:0};
      gunler[gun].net += r.net; gunler[gun].d += r.d;
    });
    const gunList = Object.entries(gunler).map(([g,v])=>({gun:g,dbn:v.d>0?v.net/v.d:0,d:v.d})).sort((a,b)=>b.dbn-a.dbn);
    return "Gün Bazlı Demet Başı Net:\n" + gunList.map((g,i)=>(i===0?"🏆 ":"   ")+g.gun+": "+fmt(g.dbn)+"/dm ("+g.d+"dm)").join("\n");
  }
  // Default: genel özet
  return "Genel Durum:\n• Net Gelir: " + fmt(stats.tn) + " | " + stats.td + " demet\n• Ort: " + fmt2(stats.av) + "/dm\n• En kârlı: " + (stats.byF[0]?.name || "—") + " (" + fmt(stats.byF[0]?.dbn || 0) + "/dm)\n• En iyi şube: " + (stats.byB[0]?.name || "—") + "\n\nÖneri sorularını dene:\n• 'Bu dönemi özetle'\n• 'Hangi günler en iyi fiyat?'\n• 'Ne artırmalıyım?'\n• 'En kârlı kombo?'";
}
