<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e18">
<title>Çallı Çiçek - Üretici Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="bg-grad"></div>
<div id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div style="font-size:14px;margin-bottom:6px">Veriler yükleniyor...</div>
    <div style="font-size:11px;color:#475569">Google Sheets'ten çekiliyor</div>
  </div>
</div>

<!-- Config & Constants -->
<script src="src/config.js"></script>
<!-- Utilities -->
<script src="src/utils.js"></script>
<!-- State Management -->
<script src="src/state.js"></script>
<!-- Data Loading -->
<script src="src/data.js"></script>
<!-- Calculations -->
<script src="src/calc.js"></script>
<!-- Seasonal Analysis -->
<script src="src/seasonal.js"></script>
<!-- Forecast -->
<script src="src/forecast.js"></script>
<!-- Report -->
<script src="src/report.js"></script>
<!-- Planner -->
<script src="src/planner.js"></script>
<!-- Kalibrasyon -->
<script src="src/calib.js"></script>
<!-- Tediye -->
<script src="src/tediye.js"></script>
<!-- Backtest (Paket 2) -->
<script src="src/backtest.js"></script>
<!-- AI Chat -->
<script src="src/ai.js"></script>
<!-- Render & UI -->
<script src="src/render.js"></script>

<!-- Init -->
<script>
// Close dropdowns on outside click
document.addEventListener("click", () => { if (state.ddOpen) setState({ ddOpen: null }); });

// ═══════════════ INIT ═══════════════
async function init() {
  try {
    const count = await loadAllData();
    if (count === 0) {
      document.getElementById("app").innerHTML = '<div class="loading-screen"><div style="font-size:16px;color:#f87171;margin-bottom:8px">Veri bulunamadı</div><div style="font-size:12px;color:#94a3b8">Google Sheets bağlantısını kontrol et.</div><div style="margin-top:20px;font-size:10px;color:#64748b;text-align:left;max-width:350px;word-break:break-all">' + esc(DEBUG_INFO) + '</div></div>';
      return;
    }
    render();
  } catch (e) {
    document.getElementById("app").innerHTML = '<div class="loading-screen"><div style="font-size:16px;color:#f87171;margin-bottom:8px">Hata: ' + esc(e.message) + '</div></div>';
  }
}

init();
</script>
</body>
</html>
