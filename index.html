<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0b0e18;color:#e2e0db;min-height:100vh;max-width:460px;margin:0 auto;-webkit-font-smoothing:antialiased}
input,button,select{font-family:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.bg-grad{position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(34,197,94,0.04) 0%,transparent 50%);pointer-events:none}
.header{padding:14px 20px 10px;border-bottom:1px solid rgba(255,255,255,0.05)}
.header-row{display:flex;justify-content:space-between;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#15803d);display:flex;align-items:center;justify-content:center;font-size:15px}
.lbl{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.val-big{font-size:20px;font-weight:800}
.card{background:rgba(255,255,255,0.03);border-radius:14px;padding:16px 14px;border:1px solid rgba(255,255,255,0.06)}

.preset-btn{padding:5px 10px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-weight:500;background:rgba(255,255,255,0.05);color:#94a3b8}

.ai-msg{margin-bottom:8px;padding:10px 12px;border-radius:11px}

.ai-send{padding:11px 16px;border-radius:11px;border:none;cursor:pointer;font-weight:600;font-size:12px}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:#64748b}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#4ade80;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.grp-grid{display:grid;gap:8px;margin-bottom:6px}
.grp-card{padding:12px 10px;text-align:center;cursor:pointer}
.trend-up{color:#34d399;font-weight:600;font-size:12px}
.trend-down{color:#f87171;font-weight:600;font-size:12px}
</style>
</head>
<body>
<div class="bg-grad"></div>
<div id="app" style="position:relative;z-index:1">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div style="font-size:14px;margin-bottom:6px">Veriler yükleniyor...</div>
    <div style="font-size:11px;color:#475569">Google Sheets'ten çekiliyor</div>
  </div>
</div>

<script>
// ═══════════════ CONFIG ═══════════════
const SHEETS = {
  "GUNCEL": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=1698698520&single=true&output=csv",
  "2025": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=1807975712&single=true&output=csv",
  "2024": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=2134869114&single=true&output=csv",
  "2023": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=1233420715&single=true&output=csv",
  "2022": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=2101024407&single=true&output=csv",
  "2021": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=1029922677&single=true&output=csv",
  "2020": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=1123710546&single=true&output=csv",
  "2019": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgQxEITteEVPQ0eoOaHXgOPe1DSB08I1LE0BTkbUmwHjrDDQJrM9eEXCXP2ubSgSe-Lm0_5OBmzrdI/pub?gid=1514448223&single=true&output=csv"
};
const GIDER = 0.20;

// ═══════════════ HELPERS ═══════════════
const fmt = n => n != null ? new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0}).format(n)+" ₺" : "—";
const fmt2 = n => n != null ? new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+" ₺" : "—";
const fD = s => { try { return new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short"}) } catch(e) { return s }};
const fDF = s => { try { return new Date(s+"T00:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}) } catch(e) { return s }};
const trendHTML = v => { if(v==null)return ""; const n=parseFloat(v); return `<span class="${n>0?'trend-up':'trend-down'}">${n>0?'▲ +':'▼ '}${Math.abs(n).toFixed(1)}%</span>` };
const esc = s => s ? s.replace(/</g,"&lt;").replace(/>/g,"&gt;") : "";

// ═══════════════ CSV PARSER ═══════════════
function parseCSV(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(l => l);
  if (lines.length < 2) return [];
  const headers = parseCSVLine(lines[0]);
  const records = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    if (vals.length < headers.length) continue;
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] || "").trim());
    records.push(obj);
  }
  return records;
}

function parseCSVLine(line) {
  const result = [];
  let current = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else current += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { result.push(current); current = ""; }
      else current += ch;
    }
  }
  result.push(current);
  return result;
}

function normalizeRecord(raw) {
  // Find columns flexibly
  const keys = Object.keys(raw);
  const find = (...terms) => keys.find(k => terms.some(t => k.toLowerCase().includes(t.toLowerCase())));

  const subeKey = find("Şube", "Sube", "şube", "sube");
  const cicekKey = find("Çiçek", "Cicek", "çiçek", "cicek");
  const adetKey = find("Adet", "adet");
  const demetKey = find("Demet", "demet");
  const birimKey = keys.find(k => k.toLowerCase().includes("birim")) || find("Birim Fiyat", "Birim fiyat");
  const tarihKey = find("Tarih", "tarih");

  const sube = raw[subeKey] || "";
  const cicek = raw[cicekKey] || "";
  const adet = parseInt((raw[adetKey] || "0").replace(/[^\d]/g, "")) || 0;
  const demet = parseInt((raw[demetKey] || "0").replace(/[^\d]/g, "")) || 0;

  let birimStr = (raw[birimKey] || "0").replace(/[^\d.,]/g, "").replace(",", ".");
  const birimFiyat = parseFloat(birimStr) || 0;

  // Parse date - handle both DD.MM.YYYY and YYYY-MM-DD
  let tarih = "";
  const rawDate = raw[tarihKey] || "";
  if (rawDate.includes(".")) {
    const parts = rawDate.split(".");
    if (parts.length >= 3) {
      const d = parts[0].padStart(2, "0");
      const m = parts[1].padStart(2, "0");
      const y = parts[2].length === 2 ? "20" + parts[2] : parts[2];
      tarih = y + "-" + m + "-" + d;
    }
  } else if (rawDate.includes("-")) {
    tarih = rawDate.substring(0, 10);
  } else if (rawDate.includes("/")) {
    const parts = rawDate.split("/");
    if (parts.length >= 3) {
      tarih = parts[2] + "-" + parts[0].padStart(2,"0") + "-" + parts[1].padStart(2,"0");
    }
  }

  if (!sube || !cicek || !tarih || birimFiyat <= 0 || demet <= 0) return null;

  return {
    s: sube, c: cicek.toUpperCase(), a: adet, d: demet,
    f: birimFiyat, t: tarih,
    ciro: birimFiyat,                          // Birim Fiyat = toplam satır fiyatı
    net: birimFiyat * (1 - GIDER),             // Net = toplam × 0.80
    dbn: demet > 0 ? (birimFiyat * (1 - GIDER)) / demet : 0  // Demet başı net
  };
}

// ═══════════════ DATA LOADING ═══════════════
let ALL_DATA = [];
let FLOWERS = [];
let BRANCHES = [];
let CICEK_GROUPS = {};
let GROUP_NAMES = [];

async function loadAllData() {
  const allRecords = [];
  const sheetNames = Object.keys(SHEETS);
  let loaded = 0;

  // Progress göster
  function updateProgress(name) {
    loaded++;
    const el = document.getElementById("app");
    if (el && el.querySelector(".loading-screen")) {
      el.innerHTML = '<div class="loading-screen"><div class="spinner"></div><div style="font-size:14px;margin-bottom:6px">Veriler yükleniyor...</div><div style="font-size:11px;color:#475569;margin-bottom:10px">' + loaded + '/' + sheetNames.length + ' sheet yüklendi (' + name + ')</div><div style="width:200px;height:4px;background:rgba(255,255,255,0.06);border-radius:2px"><div style="height:100%;border-radius:2px;background:#22c55e;width:' + (loaded/sheetNames.length*100) + '%;transition:width 0.3s"></div></div></div>';
    }
  }

  // Paralel yükleme — tüm sheet'leri aynı anda çek
  const results = await Promise.allSettled(sheetNames.map(async (name) => {
    try {
      const resp = await fetch(SHEETS[name]);
      if (!resp.ok) { DEBUG_INFO += name + ": HATA\n"; updateProgress(name); return []; }
      const text = await resp.text();
      const rows = parseCSV(text);
      
      if (rows.length > 0 && (name === "GUNCEL" || name === "2025")) {
        const keys = Object.keys(rows[0]);
        DEBUG_INFO += name + " KOLONLAR: " + keys.join(" | ") + "\n";
      }
      
      let count = 0;
      let skipped = 0;
      const recs = [];
      rows.forEach(raw => {
        const rec = normalizeRecord(raw);
        if (rec) { recs.push(rec); count++; }
        else { skipped++; }
      });
      DEBUG_INFO += name + ": " + rows.length + " satır, " + count + " geçerli, " + skipped + " atlandı\n";
      updateProgress(name);
      return recs;
    } catch (e) {
      DEBUG_INFO += name + ": HATA - " + e.message + "\n";
      updateProgress(name);
      return [];
    }
  }));

  results.forEach(r => { if (r.status === "fulfilled") allRecords.push(...r.value); });

  ALL_DATA = allRecords;
  
  // Veri kalite bilgisi — global'e kaydet
  const totalDemet = ALL_DATA.reduce((s, r) => s + r.d, 0);
  const totalCiro = ALL_DATA.reduce((s, r) => s + r.ciro, 0);
  const totalNet = ALL_DATA.reduce((s, r) => s + r.net, 0);
  window._DATA_QUALITY = {
    toplamKayit: ALL_DATA.length,
    toplamDemet: totalDemet,
    toplamCiro: Math.round(totalCiro),
    toplamNet: Math.round(totalNet),
    sonGuncelleme: new Date().toLocaleString("tr-TR"),
    enSonTarih: ALL_DATA.length > 0 ? ALL_DATA.reduce((mx, r) => r.t > mx ? r.t : mx, "") : ""
  };
  DEBUG_INFO += "TOPLAM: " + ALL_DATA.length + " kayıt, " + totalDemet + " demet, " + Math.round(totalCiro) + " ciro, " + Math.round(totalNet) + " net\n";

  FLOWERS = [...new Set(ALL_DATA.map(r => r.c))].sort();
  BRANCHES = [...new Set(ALL_DATA.map(r => r.s))].sort();

  // Auto-group flowers by first word
  CICEK_GROUPS = {};
  FLOWERS.forEach(f => {
    const parts = f.split(" ");
    const group = parts.length > 1 ? parts[0] : f;
    if (!CICEK_GROUPS[group]) CICEK_GROUPS[group] = [];
    CICEK_GROUPS[group].push(f);
  });
  // Only keep groups with 2+ flowers
  Object.keys(CICEK_GROUPS).forEach(k => {
    if (CICEK_GROUPS[k].length < 2) delete CICEK_GROUPS[k];
  });
  GROUP_NAMES = Object.keys(CICEK_GROUPS).sort();

  return ALL_DATA.length;
}

// ═══════════════ STATE ═══════════════
let state = {
  tab: "panel",
  sd: new Date().toISOString().split("T")[0],
  ed: new Date().toISOString().split("T")[0],
  sf: null, sb: null,
  fo: false,
  hmSort: "net",
  expanded: {},
  aiQ: "", aiH: [], aiL: false,
  ddOpen: null,
  chartOpen: null,
  // Planner
  planFlowers: [],
  planBoxSize: 8,
  planStrategy: "safe",
  planBranchMode: "auto", // "auto", "manual", "explore"
  planManualBranches: [], // selected branch names for manual mode
  planResult: null,
  planLoading: false,
  mevsimSearch: "",
  mevsimFilter: "aktif",
  mevsimDetail: null,
  caSecim: null,
  caSearch: "",
  riskGruplar: null
};

function setState(updates) {
  Object.assign(state, updates);
  render();
}

// ═══════════════ FILTERING & STATS ═══════════════
function getFiltered() {
  return ALL_DATA.filter(r => {
    if (r.t < state.sd || r.t > state.ed) return false;
    if (state.sf) {
      if (state.sf.startsWith("GRUP:")) {
        if (!r.c.startsWith(state.sf.replace("GRUP:", ""))) return false;
      } else {
        if (r.c !== state.sf) return false;
      }
    }
    if (state.sb && r.s !== state.sb) return false;
    return true;
  });
}

function calcStats(filtered) {
  const tc = filtered.reduce((s, r) => s + r.ciro, 0);
  const tn = filtered.reduce((s, r) => s + r.net, 0);
  const td = filtered.reduce((s, r) => s + r.d, 0);
  const av = td > 0 ? tn / td : 0; // Ort fiyat = net bazlı (gider düşülmüş)

  const groupBy = key => {
    const m = {};
    filtered.forEach(r => {
      const k = r[key];
      if (!m[k]) m[k] = { ciro: 0, net: 0, d: 0, prices: [] };
      m[k].ciro += r.ciro; m[k].net += r.net; m[k].d += r.d; m[k].prices.push(r.f);
    });
    return Object.entries(m).map(([name, v]) => ({
      name, ...v, avgP: v.d > 0 ? v.ciro / v.d : 0, dbn: v.d > 0 ? v.net / v.d : 0
    })).sort((a, b) => b.dbn - a.dbn);
  };

  const byF = groupBy("c");
  const byB = groupBy("s").sort((a,b) => b.net - a.net);

  const grpMap = {};
  filtered.forEach(r => {
    const g = GROUP_NAMES.find(x => r.c.startsWith(x)) || r.c;
    if (!grpMap[g]) grpMap[g] = { ciro: 0, net: 0, d: 0 };
    grpMap[g].ciro += r.ciro; grpMap[g].net += r.net; grpMap[g].d += r.d;
  });
  const grpList = Object.entries(grpMap).map(([n, v]) => ({ name: n, ...v, dbn: v.d > 0 ? v.net / v.d : 0 })).sort((a, b) => b.net - a.net);

  const dayMap = {};
  filtered.forEach(r => {
    if (!dayMap[r.t]) dayMap[r.t] = { ciro: 0, net: 0, d: 0 };
    dayMap[r.t].ciro += r.ciro; dayMap[r.t].net += r.net; dayMap[r.t].d += r.d;
  });
  const dl = Object.entries(dayMap).map(([d, v]) => ({ date: d, ...v, avgP: v.d > 0 ? v.ciro / v.d : 0 })).sort((a, b) => a.date.localeCompare(b.date));

  // Period comparison
  const dc = Math.max(1, Math.round((new Date(state.ed) - new Date(state.sd)) / 864e5) + 1);
  const pe = new Date(new Date(state.sd).getTime() - 864e5);
  const ps = new Date(pe.getTime() - (dc - 1) * 864e5);
  const prev = ALL_DATA.filter(r =>
    r.t >= ps.toISOString().split("T")[0] && r.t <= pe.toISOString().split("T")[0] &&
    (!state.sf || (state.sf.startsWith("GRUP:") ? r.c.startsWith(state.sf.replace("GRUP:", "")) : r.c === state.sf)) &&
    (!state.sb || r.s === state.sb)
  );
  const pc = prev.reduce((s, r) => s + r.ciro, 0);
  const cc = pc > 0 ? ((tc - pc) / pc * 100) : null;

  return { tc, tn, td, av, byF, byB, grpList, dl, cc, cnt: filtered.length };
}

// ═══════════════ PDF REPORT DATA (YENİ) ═══════════════
function getPDFReportData(filtered) {
  const stats = calcStats(filtered);

  // Seçili dönemdeki gerçek mezat günlerini bul
  const currentMezatDays = [...new Set(filtered.map(r => r.t))].sort();
  const mezatCount = currentMezatDays.length;

  // Seçili dönemden ÖNCE olan tüm mezat günlerini bul (filtre uygulanmış)
  const beforeStart = state.sd;
  const allPrevDays = [...new Set(
    ALL_DATA.filter(r =>
      r.t < beforeStart &&
      (!state.sf || (state.sf.startsWith("GRUP:") ? r.c.startsWith(state.sf.replace("GRUP:", "")) : r.c === state.sf)) &&
      (!state.sb || r.s === state.sb)
    ).map(r => r.t)
  )].sort().reverse(); // en yeniden eskiye

  // Önceki mezat günlerinden aynı sayıda al
  const prevMezatDays = allPrevDays.slice(0, mezatCount);
  const prevSD = prevMezatDays.length > 0 ? prevMezatDays[prevMezatDays.length - 1] : "";
  const prevED = prevMezatDays.length > 0 ? prevMezatDays[0] : "";

  const prevData = ALL_DATA.filter(r =>
    prevMezatDays.includes(r.t) &&
    (!state.sf || (state.sf.startsWith("GRUP:") ? r.c.startsWith(state.sf.replace("GRUP:", "")) : r.c === state.sf)) &&
    (!state.sb || r.s === state.sb)
  );
  const prevByBranch = {};
  prevData.forEach(r => {
    if (!prevByBranch[r.s]) prevByBranch[r.s] = { net: 0, d: 0, ciro: 0 };
    prevByBranch[r.s].net += r.net; prevByBranch[r.s].d += r.d; prevByBranch[r.s].ciro += r.ciro;
  });
  const branchFlowerData = {};
  filtered.forEach(r => {
    if (!branchFlowerData[r.s]) branchFlowerData[r.s] = {};
    if (!branchFlowerData[r.s][r.c]) branchFlowerData[r.s][r.c] = { net: 0, d: 0, ciro: 0 };
    branchFlowerData[r.s][r.c].net += r.net; branchFlowerData[r.s][r.c].d += r.d; branchFlowerData[r.s][r.c].ciro += r.ciro;
  });
  const prevBranchFlower = {};
  prevData.forEach(r => {
    if (!prevBranchFlower[r.s]) prevBranchFlower[r.s] = {};
    if (!prevBranchFlower[r.s][r.c]) prevBranchFlower[r.s][r.c] = { net: 0, d: 0, ciro: 0 };
    prevBranchFlower[r.s][r.c].net += r.net; prevBranchFlower[r.s][r.c].d += r.d; prevBranchFlower[r.s][r.c].ciro += r.ciro;
  });
  const branchList = stats.byB.map(b => {
    const prev = prevByBranch[b.name];
    const prevNet = prev ? prev.net : 0;
    const prevD = prev ? prev.d : 0;
    const prevDbn = prevD > 0 ? prevNet / prevD : 0;
    const currDbn = b.d > 0 ? b.net / b.d : 0;
    const netChange = prevNet > 0 ? ((b.net - prevNet) / prevNet * 100) : null;
    const dbnChange = prevDbn > 0 ? ((currDbn - prevDbn) / prevDbn * 100) : null;
    const flowers = branchFlowerData[b.name] || {};
    const flowerList = Object.entries(flowers).map(([fname, fv]) => {
      const pf = (prevBranchFlower[b.name] || {})[fname];
      const pfDbn = (pf && pf.d > 0) ? pf.net / pf.d : 0;
      const cfDbn = fv.d > 0 ? fv.net / fv.d : 0;
      const fDbnChange = pfDbn > 0 ? ((cfDbn - pfDbn) / pfDbn * 100) : null;
      return { name: fname, net: fv.net, d: fv.d, dbn: cfDbn, prevDbn: pfDbn, dbnChange: fDbnChange };
    }).sort((a, b) => b.dbn - a.dbn);
    return { name: b.name, net: b.net, d: b.d, dbn: currDbn, prevNet, prevD, prevDbn, netChange, dbnChange, flowers: flowerList };
  });
  const prevTotalNet = prevData.reduce((s, r) => s + r.net, 0);
  const prevTotalD = prevData.reduce((s, r) => s + r.d, 0);
  const prevTotalDbn = prevTotalD > 0 ? prevTotalNet / prevTotalD : 0;
  return { stats, branchList, prevSD, prevED, prevTotalNet, prevTotalD, prevTotalDbn, hasPrev: prevData.length > 0, currentMezatCount: mezatCount, prevMezatCount: prevMezatDays.length };
}

// Özel gün analiz fonksiyonu — peak day, hacim endeksi, std sapma güven, çiçek bazlı
function analyzeOzelGun(ad, oncesi, getTarih, yilDbn) {
  const yilEtkileri = [];
  const yilHacimleri = [];
  const peakGunler = []; // özel günden kaç gün önce zirve
  const cicekEtkileri = {}; // çiçek bazlı

  Object.keys(yilDbn).forEach(yil => {
    const ozelTarih = typeof getTarih === "function" ? getTarih(yil) : yil + "-" + getTarih;
    if (!ozelTarih) return;
    const baslangic = new Date(ozelTarih + "T00:00:00");
    baslangic.setDate(baslangic.getDate() - oncesi);
    const basStr = baslangic.toISOString().split("T")[0];
    const oncesiData = ALL_DATA.filter(r => r.t >= basStr && r.t <= ozelTarih && r.t.startsWith(yil));
    if (oncesiData.length === 0 || yilDbn[yil] <= 0) return;

    const oncesiDbn = oncesiData.reduce((s,r) => s+r.d, 0) > 0 ? oncesiData.reduce((s,r) => s+r.net, 0) / oncesiData.reduce((s,r) => s+r.d, 0) : 0;
    if (oncesiDbn <= 0) return;

    // Fiyat etkisi
    yilEtkileri.push(oncesiDbn / yilDbn[yil]);

    // Hacim endeksi — bu haftanın demeti vs yılın haftalık ortalama demeti
    const yilData = ALL_DATA.filter(r => r.t.startsWith(yil));
    const yilToplamD = yilData.reduce((s,r) => s+r.d, 0);
    const yilGunSayisi = new Set(yilData.map(r => r.t)).size;
    const yilGunlukOrtD = yilGunSayisi > 0 ? yilToplamD / yilGunSayisi : 0;
    const pencereD = oncesiData.reduce((s,r) => s+r.d, 0);
    const pencereGunSayisi = new Set(oncesiData.map(r => r.t)).size;
    const pencereGunlukOrtD = pencereGunSayisi > 0 ? pencereD / pencereGunSayisi : 0;
    if (yilGunlukOrtD > 0) yilHacimleri.push(pencereGunlukOrtD / yilGunlukOrtD);

    // Peak day — pencere içindeki en yüksek fiyatlı gün
    const gunFiyat = {};
    oncesiData.forEach(r => {
      if (!gunFiyat[r.t]) gunFiyat[r.t] = { net: 0, d: 0 };
      gunFiyat[r.t].net += r.net; gunFiyat[r.t].d += r.d;
    });
    let maxDbn = 0, peakTarih = null;
    Object.entries(gunFiyat).forEach(([t, v]) => {
      const dbn = v.d > 0 ? v.net / v.d : 0;
      if (dbn > maxDbn) { maxDbn = dbn; peakTarih = t; }
    });
    if (peakTarih) {
      const ozelDate = new Date(ozelTarih + "T00:00:00");
      const peakDate = new Date(peakTarih + "T00:00:00");
      const fark = Math.round((ozelDate - peakDate) / 864e5);
      if (fark >= 0) peakGunler.push(fark);
    }

    // Çiçek bazlı etki
    const cicekMap = {};
    oncesiData.forEach(r => {
      if (r.c.toLowerCase().includes("saksı") || r.c.toLowerCase().includes("saksi")) return;
      if (!cicekMap[r.c]) cicekMap[r.c] = { net: 0, d: 0 };
      cicekMap[r.c].net += r.net; cicekMap[r.c].d += r.d;
    });
    // Her çiçeğin kendi yıl ortalamasına böl
    Object.entries(cicekMap).forEach(([c, v]) => {
      if (v.d <= 0) return;
      const cicekYilData = yilData.filter(r => r.c === c);
      const cicekYilDbn = cicekYilData.reduce((s,r) => s+r.d, 0) > 0 ? cicekYilData.reduce((s,r) => s+r.net, 0) / cicekYilData.reduce((s,r) => s+r.d, 0) : 0;
      if (cicekYilDbn > 0) {
        if (!cicekEtkileri[c]) cicekEtkileri[c] = [];
        cicekEtkileri[c].push((v.net / v.d) / cicekYilDbn);
      }
    });
  });

  if (yilEtkileri.length === 0) return null;

  const ortEtki = yilEtkileri.reduce((s,x) => s+x, 0) / yilEtkileri.length;
  const stdSapma = yilEtkileri.length >= 2 ? Math.sqrt(yilEtkileri.reduce((s,x) => s + Math.pow(x - ortEtki, 2), 0) / yilEtkileri.length) : 0;
  const guvenSkoru = stdSapma > 0 ? Math.min(100, Math.round((yilEtkileri.length / stdSapma) * 10)) : (yilEtkileri.length >= 3 ? 80 : 30);
  const ortHacim = yilHacimleri.length > 0 ? yilHacimleri.reduce((s,x) => s+x, 0) / yilHacimleri.length : 1;
  const ortPeak = peakGunler.length > 0 ? Math.round(peakGunler.reduce((s,x) => s+x, 0) / peakGunler.length) : null;

  // En çok etkilenen 5 çiçek
  const topCicekler = Object.entries(cicekEtkileri).map(([c, vals]) => ({
    cicek: c, etki: Math.round((vals.reduce((s,x) => s+x, 0) / vals.length) * 100) - 100, yilSayisi: vals.length
  })).filter(c => c.yilSayisi >= 2).sort((a,b) => b.etki - a.etki).slice(0, 5);

  return { ad, oncesi, ortEtki, yilSayisi: yilEtkileri.length, stdSapma, guvenSkoru, ortHacim, ortPeak, topCicekler };
}

let _seasonalCache = null;
let _seasonalCacheTime = 0;
function getSeasonalData() {
  // 30 saniye cache — aynı veriyi tekrar tekrar hesaplama
  if (_seasonalCache && (Date.now() - _seasonalCacheTime) < 30000) return _seasonalCache;
  _seasonalCacheTime = Date.now();
  // Her yılın kendi ortalaması
  const yilOrt = {};
  ALL_DATA.forEach(r => {
    const yil = r.t.substring(0, 4);
    if (!yilOrt[yil]) yilOrt[yil] = { net: 0, d: 0 };
    yilOrt[yil].net += r.net; yilOrt[yil].d += r.d;
  });
  const yilDbn = {};
  Object.entries(yilOrt).forEach(([y, v]) => { yilDbn[y] = v.d > 0 ? v.net / v.d : 0; });

  // Aylık mevsimsel yüzde (her ayı o yılın ortalamasına böl)
  const aylik = {};
  ALL_DATA.forEach(r => {
    const yil = r.t.substring(0, 4);
    const ay = r.t.substring(5, 7);
    if (!aylik[ay]) aylik[ay] = {};
    if (!aylik[ay][yil]) aylik[ay][yil] = { net: 0, d: 0 };
    aylik[ay][yil].net += r.net; aylik[ay][yil].d += r.d;
  });

  // Ağırlıklı Trimmed Mean hesaplama fonksiyonu
  // 1. En uç yüksek ve düşük yılı at (trimmed)
  // 2. Kalan yıllara recency ağırlığı ver (son yıllar daha ağırlıklı)
  const buYil = new Date().getFullYear();
  function agirlikliTrimmedMean(yuzdeMap) {
    // yuzdeMap: { "2019": 1.05, "2020": 0.98, "2023": 1.12, ... }
    var entries = Object.entries(yuzdeMap).sort(function(a,b){ return a[1] - b[1] });
    // Trimmed mean: 4+ veri varsa en uç 2'yi at (en yüksek + en düşük)
    if (entries.length >= 4) {
      entries = entries.slice(1, entries.length - 1); // En düşük ve en yüksek yılı çıkar
    }
    // Recency ağırlık: Son yıla en yüksek, eski yıla en düşük
    var toplamAgirlik = 0;
    var toplamDeger = 0;
    entries.forEach(function(e) {
      var yil = parseInt(e[0]);
      var yuzde = e[1];
      // Ağırlık: 2^(-(buYil - yil)) → 2026=1, 2025=0.5, 2024=0.25, 2023=0.125...
      // Daha yumuşak: 1 / (1 + (buYil - yil) * 0.5) → 2026=1, 2025=0.67, 2024=0.5, 2023=0.4...
      var agirlik = 1 / (1 + (buYil - yil) * 0.5);
      toplamAgirlik += agirlik;
      toplamDeger += yuzde * agirlik;
    });
    return toplamAgirlik > 0 ? toplamDeger / toplamAgirlik : null;
  }

  const aylarData = [];
  const ayAdlari = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  for (let m = 1; m <= 12; m++) {
    const key = String(m).padStart(2, "0");
    const yilVerileri = aylik[key] || {};
    const yuzdeMap = {};
    const yuzdeler = [];
    const yillar = [];
    Object.entries(yilVerileri).forEach(([yil, v]) => {
      if (yilDbn[yil] > 0 && v.d > 0) {
        const ayDbn = v.net / v.d;
        const yuzde = ayDbn / yilDbn[yil];
        yuzdeMap[yil] = yuzde;
        yuzdeler.push(yuzde);
        yillar.push(yil);
      }
    });
    const ortYuzde = agirlikliTrimmedMean(yuzdeMap);
    const totalD = Object.values(yilVerileri).reduce((s, v) => s + v.d, 0);
    aylarData.push({
      ay: m, ad: ayAdlari[m - 1], key,
      ortYuzde, yuzdeler, yillar,
      yilSayisi: yuzdeler.length, demet: totalD
    });
  }

  // Çiçek bazlı mevsimsellik
  const cicekAylik = {};
  ALL_DATA.forEach(r => {
    const yil = r.t.substring(0, 4);
    const ay = parseInt(r.t.substring(5, 7));
    if (!cicekAylik[r.c]) cicekAylik[r.c] = {};
    if (!cicekAylik[r.c][ay]) cicekAylik[r.c][ay] = {};
    if (!cicekAylik[r.c][ay][yil]) cicekAylik[r.c][ay][yil] = { net: 0, d: 0 };
    cicekAylik[r.c][ay][yil].net += r.net; cicekAylik[r.c][ay][yil].d += r.d;
  });

  // Her çiçeğin aktif olduğu aylar ve mevsimsel yüzdesi
  const cicekMevsim = {};
  Object.entries(cicekAylik).forEach(([cicek, aylar]) => {
    cicekMevsim[cicek] = {};
    // Bu çiçeğin yıllık ortalamaları
    const cicekYilOrt = {};
    ALL_DATA.filter(r => r.c === cicek).forEach(r => {
      const yil = r.t.substring(0, 4);
      if (!cicekYilOrt[yil]) cicekYilOrt[yil] = { net: 0, d: 0 };
      cicekYilOrt[yil].net += r.net; cicekYilOrt[yil].d += r.d;
    });
    const cicekYilDbn = {};
    Object.entries(cicekYilOrt).forEach(([y, v]) => { cicekYilDbn[y] = v.d > 0 ? v.net / v.d : 0; });

    for (let m = 1; m <= 12; m++) {
      const yilVerileri = aylar[m] || {};
      const yuzdeMap = {};
      Object.entries(yilVerileri).forEach(([yil, v]) => {
        if (cicekYilDbn[yil] > 0 && v.d > 0) {
          yuzdeMap[yil] = (v.net / v.d) / cicekYilDbn[yil];
        }
      });
      const ortYuzde = agirlikliTrimmedMean(yuzdeMap);
      if (ortYuzde !== null) {
        cicekMevsim[cicek][m] = {
          ortYuzde: ortYuzde,
          yilSayisi: Object.keys(yuzdeMap).length,
          totalD: Object.values(yilVerileri).reduce((s, v) => s + v.d, 0)
        };
      }
    }
  });

  // Hafta günü mevsimselliği — ENFLASYONSuZ (her haftayı kendi içinde normalize et)
  const mezatGunleri = ["Pazartesi", "Çarşamba", "Cuma"];
  // Her ISO hafta için günlük endeks hesapla
  const haftaGunVeri = {}; // { "2024-W12": { "Pazartesi": {net,d}, "Çarşamba": {net,d}, haftaOrt: X } }
  ALL_DATA.forEach(r => {
    const d = new Date(r.t + "T00:00:00");
    const gunAdi = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"][d.getDay()];
    if (!mezatGunleri.includes(gunAdi)) return;
    const yil = r.t.substring(0, 4);
    const hafta = yil + "-W" + String(getWeekNumber(d)).padStart(2, "0");
    if (!haftaGunVeri[hafta]) haftaGunVeri[hafta] = {};
    if (!haftaGunVeri[hafta][gunAdi]) haftaGunVeri[hafta][gunAdi] = { net: 0, d: 0 };
    haftaGunVeri[hafta][gunAdi].net += r.net; haftaGunVeri[hafta][gunAdi].d += r.d;
  });
  // Her haftanın ortalamasını hesapla, sonra her günü o ortalamaya böl
  const gunEndeksler = {}; // { "Pazartesi": [1.05, 0.98, 1.02, ...], "Çarşamba": [...] }
  const gunToplamNet = {}; // { "Pazartesi": totalNet }
  mezatGunleri.forEach(g => { gunEndeksler[g] = []; gunToplamNet[g] = 0; });
  Object.values(haftaGunVeri).forEach(hafta => {
    // Haftadaki tüm günlerin birleşik ortalaması
    let hNet = 0, hD = 0;
    Object.values(hafta).forEach(v => { hNet += v.net; hD += v.d; });
    const haftaOrt = hD > 0 ? hNet / hD : 0;
    if (haftaOrt <= 0) return;
    // Her günü hafta ortalamasına böl
    mezatGunleri.forEach(g => {
      if (hafta[g] && hafta[g].d > 0) {
        const gunDbn = hafta[g].net / hafta[g].d;
        gunEndeksler[g].push(gunDbn / haftaOrt);
        gunToplamNet[g] += hafta[g].net;
      }
    });
  });
  const gunList = mezatGunleri.map(g => {
    const vals = gunEndeksler[g];
    if (vals.length === 0) return null;
    const ort = vals.reduce((s, x) => s + x, 0) / vals.length;
    return { gun: g, endeks: Math.round(ort * 100), mezatSayisi: vals.length, toplamNet: gunToplamNet[g] };
  }).filter(g => g !== null).sort((a, b) => b.endeks - a.endeks);

  // Çiçek bazlı gün performansı (en çok satılan 8 çiçek)
  const cicekGunVeri = {};
  ALL_DATA.forEach(r => {
    if (r.c.toLowerCase().includes("saksı") || r.c.toLowerCase().includes("saksi")) return;
    const d = new Date(r.t + "T00:00:00");
    const gunAdi = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"][d.getDay()];
    if (!mezatGunleri.includes(gunAdi)) return;
    const yil = r.t.substring(0, 4);
    const hafta = yil + "-W" + String(getWeekNumber(d)).padStart(2, "0");
    if (!cicekGunVeri[r.c]) cicekGunVeri[r.c] = {};
    if (!cicekGunVeri[r.c][hafta]) cicekGunVeri[r.c][hafta] = {};
    if (!cicekGunVeri[r.c][hafta][gunAdi]) cicekGunVeri[r.c][hafta][gunAdi] = { net: 0, d: 0 };
    cicekGunVeri[r.c][hafta][gunAdi].net += r.net; cicekGunVeri[r.c][hafta][gunAdi].d += r.d;
  });
  const cicekGunEndeks = {};
  Object.entries(cicekGunVeri).forEach(([cicek, haftalar]) => {
    const gunE = {};
    mezatGunleri.forEach(g => { gunE[g] = []; });
    Object.values(haftalar).forEach(hafta => {
      let hNet = 0, hD = 0;
      Object.values(hafta).forEach(v => { hNet += v.net; hD += v.d; });
      const haftaOrt = hD > 0 ? hNet / hD : 0;
      if (haftaOrt <= 0) return;
      mezatGunleri.forEach(g => {
        if (hafta[g] && hafta[g].d > 0) {
          gunE[g].push((hafta[g].net / hafta[g].d) / haftaOrt);
        }
      });
    });
    const toplamVeri = mezatGunleri.reduce((s, g) => s + gunE[g].length, 0);
    if (toplamVeri < 10) return;
    cicekGunEndeks[cicek] = {};
    mezatGunleri.forEach(g => {
      if (gunE[g].length > 0) {
        cicekGunEndeks[cicek][g] = Math.round((gunE[g].reduce((s,x) => s+x, 0) / gunE[g].length) * 100);
      }
    });
    cicekGunEndeks[cicek]._toplamD = ALL_DATA.filter(r => r.c === cicek).reduce((s,r) => s+r.d, 0);
  });

  // 2026 projeksiyon — EMA baz fiyat (son haftalara daha fazla ağırlık)
  const yil2026 = ALL_DATA.filter(r => r.t.startsWith("2026"));
  // Günlük dm başı net hesapla ve EMA uygula
  const gunMap2026 = {};
  yil2026.forEach(r => {
    if (!gunMap2026[r.t]) gunMap2026[r.t] = { net: 0, d: 0 };
    gunMap2026[r.t].net += r.net; gunMap2026[r.t].d += r.d;
  });
  const gunSirali2026 = Object.entries(gunMap2026).sort((a,b) => a[0].localeCompare(b[0])).map(e => e[1].d > 0 ? e[1].net / e[1].d : 0).filter(v => v > 0);
  // EMA hesapla — alpha=2/(N+1), N=son 20 gün bazlı
  let ema2026 = 0;
  if (gunSirali2026.length > 0) {
    const alpha = 2 / (Math.min(20, gunSirali2026.length) + 1);
    ema2026 = gunSirali2026[0];
    for (let i = 1; i < gunSirali2026.length; i++) {
      ema2026 = alpha * gunSirali2026[i] + (1 - alpha) * ema2026;
    }
  }
  const ort2026 = ema2026 > 0 ? ema2026 : (yil2026.reduce((s,r) => s+r.d, 0) > 0 ? yil2026.reduce((s,r) => s+r.net, 0) / yil2026.reduce((s,r) => s+r.d, 0) : 0);

  // Güven aralığı verisi — her ay için geçmiş yılların std sapması
  const ayGuvenAraligi = {};
  for (let m = 1; m <= 12; m++) {
    const key = String(m).padStart(2, "0");
    const yilVerileri = aylik[key] || {};
    const oranlar = [];
    Object.entries(yilVerileri).forEach(([yil, v]) => {
      if (yilDbn[yil] > 0 && v.d > 0) {
        oranlar.push((v.net / v.d) / yilDbn[yil]);
      }
    });
    if (oranlar.length >= 2) {
      const ort = oranlar.reduce((s,x) => s+x, 0) / oranlar.length;
      const stdSapma = Math.sqrt(oranlar.reduce((s,x) => s + Math.pow(x - ort, 2), 0) / oranlar.length);
      ayGuvenAraligi[m] = { ort, stdSapma, alt: ort - 1.96 * stdSapma, ust: ort + 1.96 * stdSapma };
    }
  }

  // Backtesting — geçmiş ayların tahmin vs gerçekleşen hata payı
  const backtesting = [];
  const buAyNum = new Date().getMonth() + 1;
  yil2026.length > 0 && (function() {
    for (let m = 1; m < buAyNum; m++) {
      const ayData = yil2026.filter(r => parseInt(r.t.substring(5,7)) === m);
      if (ayData.length === 0) continue;
      const gerceklesen = ayData.reduce((s,r) => s+r.d, 0) > 0 ? ayData.reduce((s,r) => s+r.net, 0) / ayData.reduce((s,r) => s+r.d, 0) : 0;
      // Tahmin: ort2026 × mevsimsel endeks
      const ayEndeks = aylarData[m-1];
      if (!ayEndeks || ayEndeks.ortYuzde === null) continue;
      const tahmin = ort2026 * ayEndeks.ortYuzde;
      const hata = tahmin > 0 ? ((gerceklesen - tahmin) / tahmin * 100) : 0;
      backtesting.push({ ay: m, tahmin, gerceklesen, hata, ad: ayEndeks.ad });
    }
  })();

  // Özel gün analizi
  const ozelGunAnaliz = [];
  // Sabit tarihli özel günler
  OZEL_GUNLER.forEach(og => {
    const result = analyzeOzelGun(og.ad, og.oncesi, og.tarih, yilDbn);
    if (result) ozelGunAnaliz.push(result);
  });
  // Anneler Günü (dinamik)
  const agResult = analyzeOzelGun("Anneler Günü", 7, function(yil){ return getAnnelerGunu(parseInt(yil)); }, yilDbn);
  if (agResult) ozelGunAnaliz.push(agResult);
  // Dini bayramlar (hareketli tarihler)
  Object.values(DINI_BAYRAMLAR).forEach(db => {
    const result = analyzeOzelGun(db.ad, db.oncesi, function(yil){ return db.tarihler[yil] || null; }, yilDbn);
    if (result) ozelGunAnaliz.push(result);
  });
  ozelGunAnaliz.sort((a, b) => b.ortEtki - a.ortEtki);

  // Çiçek × Ay × Hafta bazlı mevsimsel veri
  const cicekAyHafta = {};
  ALL_DATA.forEach(r => {
    const yil = r.t.substring(0, 4);
    const ay = parseInt(r.t.substring(5, 7));
    const d = new Date(r.t + "T00:00:00");
    const haftaGunu = d.getDate();
    const haftaNo = Math.ceil(haftaGunu / 7); // 1-5 arası hafta
    const key = r.c + "|" + ay + "|" + haftaNo;
    if (!cicekAyHafta[key]) cicekAyHafta[key] = {};
    if (!cicekAyHafta[key][yil]) cicekAyHafta[key][yil] = { net: 0, d: 0 };
    cicekAyHafta[key][yil].net += r.net; cicekAyHafta[key][yil].d += r.d;
  });

  // Her çiçeğin yıllık ortalamaları (çiçek bazlı)
  const cicekYilOrtMap = {};
  ALL_DATA.forEach(r => {
    const yil = r.t.substring(0, 4);
    if (!cicekYilOrtMap[r.c]) cicekYilOrtMap[r.c] = {};
    if (!cicekYilOrtMap[r.c][yil]) cicekYilOrtMap[r.c][yil] = { net: 0, d: 0 };
    cicekYilOrtMap[r.c][yil].net += r.net; cicekYilOrtMap[r.c][yil].d += r.d;
  });

  // Haftalık mevsimsel endeks hesapla
  function getHaftalikEndeks(cicek, ay) {
    const result = [];
    for (let h = 1; h <= 5; h++) {
      const key = cicek + "|" + ay + "|" + h;
      const yilVerileri = cicekAyHafta[key] || {};
      const yuzdeMap = {};
      let toplamD = 0;
      Object.entries(yilVerileri).forEach(([yil, v]) => {
        const cYilOrt = cicekYilOrtMap[cicek] && cicekYilOrtMap[cicek][yil];
        const yilDbnC = cYilOrt && cYilOrt.d > 0 ? cYilOrt.net / cYilOrt.d : 0;
        if (yilDbnC > 0 && v.d > 0) {
          yuzdeMap[yil] = (v.net / v.d) / yilDbnC;
          toplamD += v.d;
        }
      });
      const ortYuzde = agirlikliTrimmedMean(yuzdeMap);
      if (ortYuzde !== null) {
        result.push({
          hafta: h,
          endeks: Math.round(ortYuzde * 100),
          yilSayisi: Object.keys(yuzdeMap).length,
          demet: toplamD
        });
      }
    }
    return result;
  }

  // Sezon başlangıç/bitiş standart sapması — her çiçeğin sezonu ±kaç gün oynuyor
  const cicekSezonBilgi = {};
  Object.entries(cicekAylik).forEach(([cicek, aylar]) => {
    if (cicek.toLowerCase().includes("saksı") || cicek.toLowerCase().includes("saksi")) return;
    // Her yılda ilk ve son satış haftasını bul
    const yilBas = {}; // { "2023": 5 (hafta no), "2024": 7, ... }
    const yilSon = {};
    ALL_DATA.filter(r => r.c === cicek).forEach(r => {
      const yil = r.t.substring(0, 4);
      const d = new Date(r.t + "T00:00:00");
      const hafta = getWeekNumber(d);
      if (!yilBas[yil] || hafta < yilBas[yil]) yilBas[yil] = hafta;
      if (!yilSon[yil] || hafta > yilSon[yil]) yilSon[yil] = hafta;
    });
    const basHaftalar = Object.values(yilBas);
    const sonHaftalar = Object.values(yilSon);
    if (basHaftalar.length < 2) return;

    const basOrt = Math.round(basHaftalar.reduce((s,x) => s+x, 0) / basHaftalar.length);
    const sonOrt = Math.round(sonHaftalar.reduce((s,x) => s+x, 0) / sonHaftalar.length);
    const basStd = Math.round(Math.sqrt(basHaftalar.reduce((s,x) => s + Math.pow(x - basOrt, 2), 0) / basHaftalar.length) * 7); // gün cinsine çevir
    const sonStd = Math.round(Math.sqrt(sonHaftalar.reduce((s,x) => s + Math.pow(x - sonOrt, 2), 0) / sonHaftalar.length) * 7);

    cicekSezonBilgi[cicek] = { basOrt, sonOrt, basStd, sonStd, yilSayisi: basHaftalar.length };
  });

  _seasonalCache = { aylarData, cicekMevsim, gunList, ort2026, yilDbn, ozelGunAnaliz, cicekAylik, getHaftalikEndeks, ayGuvenAraligi, backtesting, cicekGunEndeks, cicekSezonBilgi };
  return _seasonalCache;
}

function getForecast() {
  const bugun = new Date();
  const buYil = bugun.getFullYear();
  const buAy = bugun.getMonth() + 1;
  const buHafta = getWeekNumber(bugun);

  // 2026 verisi — EMA baz fiyat
  const data2026 = ALL_DATA.filter(r => r.t.startsWith(String(buYil)));
  const gunMap2026F = {};
  data2026.forEach(r => { if (!gunMap2026F[r.t]) gunMap2026F[r.t] = {net:0,d:0}; gunMap2026F[r.t].net += r.net; gunMap2026F[r.t].d += r.d; });
  const gunSirali2026F = Object.entries(gunMap2026F).sort((a,b) => a[0].localeCompare(b[0])).map(e => e[1].d > 0 ? e[1].net / e[1].d : 0).filter(v => v > 0);
  let ema2026F = 0;
  if (gunSirali2026F.length > 0) {
    const alpha = 2 / (Math.min(20, gunSirali2026F.length) + 1);
    ema2026F = gunSirali2026F[0];
    for (let i = 1; i < gunSirali2026F.length; i++) ema2026F = alpha * gunSirali2026F[i] + (1 - alpha) * ema2026F;
  }
  const ort2026 = ema2026F > 0 ? ema2026F : (data2026.reduce((s,r) => s+r.d, 0) > 0 ? data2026.reduce((s,r) => s+r.net, 0) / data2026.reduce((s,r) => s+r.d, 0) : 0);

  // Son 2 hafta trendi
  const son14 = new Date(bugun); son14.setDate(son14.getDate() - 14);
  const son14str = son14.toISOString().split("T")[0];
  const recentData = ALL_DATA.filter(r => r.t >= son14str && r.t.startsWith(String(buYil)));
  const son7str = new Date(bugun); son7str.setDate(son7str.getDate() - 7);
  const hafta1 = recentData.filter(r => r.t < son7str.toISOString().split("T")[0]);
  const hafta2 = recentData.filter(r => r.t >= son7str.toISOString().split("T")[0]);
  const h1Dbn = hafta1.reduce((s,r) => s+r.d, 0) > 0 ? hafta1.reduce((s,r) => s+r.net, 0) / hafta1.reduce((s,r) => s+r.d, 0) : 0;
  const h2Dbn = hafta2.reduce((s,r) => s+r.d, 0) > 0 ? hafta2.reduce((s,r) => s+r.net, 0) / hafta2.reduce((s,r) => s+r.d, 0) : 0;
  const trendPct = h1Dbn > 0 ? ((h2Dbn - h1Dbn) / h1Dbn * 100) : 0;

  const gelecekHafta = new Date(bugun); gelecekHafta.setDate(gelecekHafta.getDate() + 7);
  const ghAy = gelecekHafta.getMonth() + 1;
  const ghHafta = getWeekNumber(gelecekHafta);
  const yillar = [...new Set(ALL_DATA.map(r => r.t.substring(0,4)))].filter(y => y !== String(buYil));
  
  const genelTahmin = calcWeekForecast(null, ghAy, ghHafta, yillar, ort2026, h2Dbn, trendPct);

  // Çiçek bazlı tahmin — EMA baz
  const cicekTahminleri = [];
  const aktifCicekler = [...new Set(recentData.map(r => r.c))];
  aktifCicekler.forEach(cicek => {
    // EMA hesapla çiçek bazlı
    const cGunMap = {};
    data2026.filter(r => r.c === cicek).forEach(r => { if (!cGunMap[r.t]) cGunMap[r.t] = {net:0,d:0}; cGunMap[r.t].net += r.net; cGunMap[r.t].d += r.d; });
    const cGunS = Object.entries(cGunMap).sort((a,b) => a[0].localeCompare(b[0])).map(e => e[1].d > 0 ? e[1].net / e[1].d : 0).filter(v => v > 0);
    let cEma = 0;
    if (cGunS.length > 0) { const a = 2 / (Math.min(15, cGunS.length) + 1); cEma = cGunS[0]; for (let i = 1; i < cGunS.length; i++) cEma = a * cGunS[i] + (1-a) * cEma; }
    const cicekOrt = cEma > 0 ? cEma : (data2026.filter(r => r.c === cicek).reduce((s,r) => s+r.d, 0) > 0 ? data2026.filter(r => r.c === cicek).reduce((s,r) => s+r.net, 0) / data2026.filter(r => r.c === cicek).reduce((s,r) => s+r.d, 0) : 0);
    
    const cRecent1 = hafta1.filter(r => r.c === cicek);
    const cRecent2 = hafta2.filter(r => r.c === cicek);
    const cH1 = cRecent1.reduce((s,r) => s+r.d, 0) > 0 ? cRecent1.reduce((s,r) => s+r.net, 0) / cRecent1.reduce((s,r) => s+r.d, 0) : 0;
    const cH2 = cRecent2.reduce((s,r) => s+r.d, 0) > 0 ? cRecent2.reduce((s,r) => s+r.net, 0) / cRecent2.reduce((s,r) => s+r.d, 0) : 0;
    const cTrend = cH1 > 0 ? ((cH2 - cH1) / cH1 * 100) : 0;

    const tahmin = calcWeekForecast(cicek, ghAy, ghHafta, yillar, cicekOrt, cH2, cTrend);
    if (tahmin.merkez > 0) cicekTahminleri.push({ cicek, ...tahmin, sonFiyat: cH2, trend: cTrend });
  });
  cicekTahminleri.sort((a, b) => b.merkez - a.merkez);

  // Şube bazlı tahmin — EMA baz
  const subeTahminleri = [];
  const aktifSubeler = [...new Set(recentData.map(r => r.s))];
  aktifSubeler.forEach(sube => {
    const sGunMap = {};
    data2026.filter(r => r.s === sube).forEach(r => { if (!sGunMap[r.t]) sGunMap[r.t] = {net:0,d:0}; sGunMap[r.t].net += r.net; sGunMap[r.t].d += r.d; });
    const sGunS = Object.entries(sGunMap).sort((a,b) => a[0].localeCompare(b[0])).map(e => e[1].d > 0 ? e[1].net / e[1].d : 0).filter(v => v > 0);
    let sEma = 0;
    if (sGunS.length > 0) { const a = 2 / (Math.min(15, sGunS.length) + 1); sEma = sGunS[0]; for (let i = 1; i < sGunS.length; i++) sEma = a * sGunS[i] + (1-a) * sEma; }
    const subeOrt = sEma > 0 ? sEma : (data2026.filter(r => r.s === sube).reduce((s,r) => s+r.d, 0) > 0 ? data2026.filter(r => r.s === sube).reduce((s,r) => s+r.net, 0) / data2026.filter(r => r.s === sube).reduce((s,r) => s+r.d, 0) : 0);
    const sRecent2 = hafta2.filter(r => r.s === sube);
    const sH2 = sRecent2.reduce((s,r) => s+r.d, 0) > 0 ? sRecent2.reduce((s,r) => s+r.net, 0) / sRecent2.reduce((s,r) => s+r.d, 0) : 0;
    const sTrend = subeOrt > 0 ? ((sH2 - subeOrt) / subeOrt * 100) : 0;
    const tahmin = calcWeekForecast(null, ghAy, ghHafta, yillar, subeOrt, sH2, sTrend);
    if (tahmin.merkez > 0) subeTahminleri.push({ sube, ...tahmin, sonFiyat: sH2 });
  });
  subeTahminleri.sort((a, b) => b.merkez - a.merkez);

  return { genelTahmin, cicekTahminleri, subeTahminleri, h2Dbn, trendPct, ghAy, ghHafta, ort2026 };
}

function getWeekNumber(d) {
  const date = new Date(d.getTime());
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 864e5 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function calcWeekForecast(cicek, targetAy, targetHafta, yillar, currentYearAvg, lastWeekDbn, trendPct) {
  // Geçmiş yılların aynı haftasındaki mevsimsel yüzdeleri bul — ±1 hafta smoothing
  const mevsimselYuzdeler = [];

  yillar.forEach(yil => {
    let yilData = ALL_DATA.filter(r => r.t.startsWith(yil));
    if (cicek) yilData = yilData.filter(r => r.c === cicek);
    const yilDbn = yilData.reduce((s,r) => s+r.d, 0) > 0 ? yilData.reduce((s,r) => s+r.net, 0) / yilData.reduce((s,r) => s+r.d, 0) : 0;
    if (yilDbn <= 0) return;

    // ±1 hafta smoothing — targetHafta-1, targetHafta, targetHafta+1 ortalaması
    let haftaData = yilData.filter(r => {
      const d = new Date(r.t + "T00:00:00");
      const hw = getWeekNumber(d);
      return hw >= targetHafta - 1 && hw <= targetHafta + 1;
    });
    if (haftaData.length === 0) {
      haftaData = yilData.filter(r => parseInt(r.t.substring(5,7)) === targetAy);
    }
    if (haftaData.length === 0) return;

    const haftaDbn = haftaData.reduce((s,r) => s+r.d, 0) > 0 ? haftaData.reduce((s,r) => s+r.net, 0) / haftaData.reduce((s,r) => s+r.d, 0) : 0;
    if (haftaDbn > 0) mevsimselYuzdeler.push(haftaDbn / yilDbn);
  });

  if (mevsimselYuzdeler.length === 0 || currentYearAvg <= 0) {
    if (lastWeekDbn > 0) {
      const trendFactor = 1 + (trendPct / 100) * 0.5;
      const merkez = lastWeekDbn * trendFactor;
      return { merkez, alt: merkez * 0.9, ust: merkez * 1.1, guven: "düşük", yilSayisi: 0 };
    }
    return { merkez: 0, alt: 0, ust: 0, guven: "yok", yilSayisi: 0 };
  }

  const ortMevsimsel = mevsimselYuzdeler.reduce((s,x) => s+x, 0) / mevsimselYuzdeler.length;

  // Mevsimsel tahmin: EMA baz × mevsimsel yüzde
  const mevsimselTahmin = currentYearAvg * ortMevsimsel;

  // Trend yönü kontrolü — mevsimsellikle aynı yönde mi?
  const mevsimselYon = ortMevsimsel > 1 ? 1 : ortMevsimsel < 1 ? -1 : 0; // mevsim yükseliş/düşüş
  const trendYon = trendPct > 0 ? 1 : trendPct < 0 ? -1 : 0;
  const ayniYon = mevsimselYon === trendYon || mevsimselYon === 0 || trendYon === 0;
  const trendCarpani = ayniYon ? 0.4 : 0.2; // Aynı yönde güçlendir, zıt yönde zayıflat

  const trendFactor = 1 + (trendPct / 100) * trendCarpani;
  const trendTahmin = lastWeekDbn > 0 ? lastWeekDbn * trendFactor : mevsimselTahmin;

  // Dinamik ağırlıklandırma — piyasa çalkantılıysa güncel veriye daha çok ağırlık
  let wMevsim = 0.50, wGuncel = 0.30, wTrend = 0.20;
  if (Math.abs(trendPct) > 15) {
    // Piyasa çok hareketli — mevsimselliğe daha az güven, güncel fiyata daha çok
    wMevsim = 0.30; wGuncel = 0.50; wTrend = 0.20;
  } else if (Math.abs(trendPct) > 8) {
    wMevsim = 0.40; wGuncel = 0.40; wTrend = 0.20;
  }

  const merkez = mevsimselTahmin * wMevsim + (lastWeekDbn > 0 ? lastWeekDbn : mevsimselTahmin) * wGuncel + trendTahmin * wTrend;

  // Güven aralığı — standart sapma bazlı (±1.96σ = %95 güven)
  const mevsStd = mevsimselYuzdeler.length >= 2 ? Math.sqrt(mevsimselYuzdeler.reduce((s,x) => s + Math.pow(x - ortMevsimsel, 2), 0) / mevsimselYuzdeler.length) : ortMevsimsel * 0.15;
  const alt = currentYearAvg * Math.max(0.3, ortMevsimsel - 1.96 * mevsStd);
  const ust = currentYearAvg * (ortMevsimsel + 1.96 * mevsStd);

  // Güven seviyesi — yıl sayısı + standart sapma bazlı
  let guven = "orta";
  const cv = ortMevsimsel > 0 ? (mevsStd / ortMevsimsel * 100) : 100;
  if (mevsimselYuzdeler.length >= 4 && cv < 15) guven = "yüksek";
  else if (mevsimselYuzdeler.length <= 1 || cv > 30) guven = "düşük";

  return { merkez, alt, ust, guven, yilSayisi: mevsimselYuzdeler.length };
}

function getAlerts(filtered) {

  const result = [];
  const todayRecs = ALL_DATA.filter(r => r.t === today);
  if (todayRecs.length) {
    // Çiçek×şube bazında grupla
    const kombo = {};
    todayRecs.forEach(r => {
      const key = r.c + "→" + r.s;
      if (!kombo[key]) kombo[key] = { c: r.c, s: r.s, net: 0, d: 0 };
      kombo[key].net += r.net; kombo[key].d += r.d;
    });
    const list = Object.values(kombo).filter(k => k.d >= 5); // min 5 demet eşiği
    if (list.length > 0) {
      // En yüksek dm başı net
      const bestDbn = [...list].sort((a,b) => (b.net/b.d) - (a.net/a.d))[0];
      result.push({ type: "star", text: "Dm başı en iyi: " + esc(bestDbn.c) + " → " + esc(bestDbn.s) + " (" + fmt(bestDbn.net/bestDbn.d) + "/dm)" });
      // En yüksek toplam net
      const bestNet = [...list].sort((a,b) => b.net - a.net)[0];
      if (bestNet.c !== bestDbn.c || bestNet.s !== bestDbn.s) {
        result.push({ type: "up", text: "Toplam en iyi: " + esc(bestNet.c) + " → " + esc(bestNet.s) + " (" + fmt(bestNet.net) + ")" });
      }
    }
  }
  return result.slice(0, 4);
}

function getBranchComp(filtered) {
  const m = {};
  filtered.forEach(r => {
    if (!m[r.c]) m[r.c] = {};
    if (!m[r.c][r.s]) m[r.c][r.s] = { ciro: 0, net: 0, d: 0 };
    m[r.c][r.s].ciro += r.ciro; m[r.c][r.s].net += r.net; m[r.c][r.s].d += r.d;
  });
  // Son 14 gün trend için
  const son14 = new Date(); son14.setDate(son14.getDate() - 14);
  const son14str = son14.toISOString().split("T")[0];
  const son7 = new Date(); son7.setDate(son7.getDate() - 7);
  const son7str = son7.toISOString().split("T")[0];

  return Object.entries(m).map(([flower, branches]) => {
    const brList = Object.entries(branches).map(([n, v]) => {
      const dbn = v.d > 0 ? v.net / v.d : 0;
      // Trend: son 7 gün vs önceki 7 gün
      const r1 = ALL_DATA.filter(r => r.c === flower && r.s === n && r.t >= son14str && r.t < son7str);
      const r2 = ALL_DATA.filter(r => r.c === flower && r.s === n && r.t >= son7str);
      const d1 = r1.reduce((s,r)=>s+r.d,0) > 0 ? r1.reduce((s,r)=>s+r.net,0)/r1.reduce((s,r)=>s+r.d,0) : 0;
      const d2 = r2.reduce((s,r)=>s+r.d,0) > 0 ? r2.reduce((s,r)=>s+r.net,0)/r2.reduce((s,r)=>s+r.d,0) : 0;
      const trend = d1 > 0 ? ((d2 - d1) / d1 * 100) : 0;
      return { name: n, ...v, dbn, avgP: v.d > 0 ? v.ciro / v.d : 0, trend };
    }).sort((a, b) => b.dbn - a.dbn);
    const toplamD = brList.reduce((s,b) => s+b.d, 0);
    return { flower, branches: brList, totalD: toplamD, branchCount: brList.length };
  }).sort((a, b) => b.totalD - a.totalD);
}

function getHeatData(filtered) {
  const m = {};
  filtered.forEach(r => {
    const k = r.c + "|" + r.s;
    if (!m[k]) m[k] = { net: 0, d: 0, ciro: 0 };
    m[k].net += r.net; m[k].d += r.d; m[k].ciro += r.ciro;
  });
  const list = Object.entries(m).map(([k, v]) => {
    const p = k.split("|");
    return { cicek: p[0], sube: p[1], ...v, dbn: v.d > 0 ? v.net / v.d : 0, avgP: v.d > 0 ? v.ciro / v.d : 0 };
  });
  list.sort((a, b) => state.hmSort === "net" ? b.dbn - a.dbn : b.avgP - a.avgP);
  return list;
}

function getYoY(filtered) {
  const lyS = new Date(state.sd); lyS.setFullYear(lyS.getFullYear() - 1);
  const lyE = new Date(state.ed); lyE.setFullYear(lyE.getFullYear() - 1);
  const ls = lyS.toISOString().split("T")[0];
  const le = lyE.toISOString().split("T")[0];
  const lastD = ALL_DATA.filter(r => r.t >= ls && r.t <= le &&
    (!state.sf || (state.sf.startsWith("GRUP:") ? r.c.startsWith(state.sf.replace("GRUP:", "")) : r.c === state.sf)) &&
    (!state.sb || r.s === state.sb));

  // Totals - NET based
  const tN = filtered.reduce((s, r) => s + r.net, 0);
  const tD = filtered.reduce((s, r) => s + r.d, 0);
  const tA = tD > 0 ? tN / tD : 0; // net per demet
  const lN = lastD.reduce((s, r) => s + r.net, 0);
  const lDm = lastD.reduce((s, r) => s + r.d, 0);
  const lA = lDm > 0 ? lN / lDm : 0;

  // Per flower comparison
  const flowerMap = {};
  filtered.forEach(r => {
    if (!flowerMap[r.c]) flowerMap[r.c] = { thisNet: 0, thisD: 0, lastNet: 0, lastD: 0 };
    flowerMap[r.c].thisNet += r.net;
    flowerMap[r.c].thisD += r.d;
  });
  lastD.forEach(r => {
    if (!flowerMap[r.c]) flowerMap[r.c] = { thisNet: 0, thisD: 0, lastNet: 0, lastD: 0 };
    flowerMap[r.c].lastNet += r.net;
    flowerMap[r.c].lastD += r.d;
  });
  const flowers = Object.entries(flowerMap).map(([name, v]) => ({
    name,
    thisNet: v.thisNet, thisD: v.thisD,
    thisDbn: v.thisD > 0 ? v.thisNet / v.thisD : 0,
    lastNet: v.lastNet, lastD: v.lastD,
    lastDbn: v.lastD > 0 ? v.lastNet / v.lastD : 0,
    dbnDiff: (v.thisD > 0 ? v.thisNet / v.thisD : 0) - (v.lastD > 0 ? v.lastNet / v.lastD : 0),
    dbnPct: (v.lastD > 0 && v.thisD > 0) ? (((v.thisNet / v.thisD) - (v.lastNet / v.lastD)) / (v.lastNet / v.lastD) * 100) : null,
    demetDiff: v.thisD - v.lastD,
  })).sort((a, b) => Math.abs(b.dbnDiff) - Math.abs(a.dbnDiff));

  // Per branch comparison
  const branchMap = {};
  filtered.forEach(r => {
    if (!branchMap[r.s]) branchMap[r.s] = { thisNet: 0, thisD: 0, lastNet: 0, lastD: 0 };
    branchMap[r.s].thisNet += r.net;
    branchMap[r.s].thisD += r.d;
  });
  lastD.forEach(r => {
    if (!branchMap[r.s]) branchMap[r.s] = { thisNet: 0, thisD: 0, lastNet: 0, lastD: 0 };
    branchMap[r.s].lastNet += r.net;
    branchMap[r.s].lastD += r.d;
  });
  const branches = Object.entries(branchMap).map(([name, v]) => ({
    name,
    thisNet: v.thisNet, thisD: v.thisD,
    lastNet: v.lastNet, lastD: v.lastD,
    netDiff: v.thisNet - v.lastNet,
    netPct: v.lastNet > 0 ? ((v.thisNet - v.lastNet) / v.lastNet * 100) : null,
  })).sort((a, b) => b.thisNet - a.thisNet);

  return {
    tN, tD, tA, lN, lD: lDm, lA,
    nCh: lN > 0 ? ((tN - lN) / lN * 100) : null,
    pCh: lA > 0 ? ((tA - lA) / lA * 100) : null,
    has: lastD.length > 0,
    flowers, branches
  };
}

function buildLineChart(key, type) {
  // key = flower name or branch name, type = "c" for flower, "s" for branch
  const data = getFiltered().filter(r => r[type] === key);
  if (!data.length) return "";

  // Group by date
  const byDate = {};
  data.forEach(r => {
    if (!byDate[r.t]) byDate[r.t] = { net: 0, d: 0 };
    byDate[r.t].net += r.net;
    byDate[r.t].d += r.d;
  });
  const points = Object.entries(byDate)
    .map(([date, v]) => ({ date, dbn: v.d > 0 ? v.net / v.d : 0, d: v.d }))
    .sort((a, b) => a.date.localeCompare(b.date));

  if (points.length < 2) {
    return `<div style="padding:12px 0;font-size:11px;color:#64748b;text-align:center">Grafik için en az 2 günlük veri gerekli</div>`;
  }

  const W = 320, H = 100, PX = 30, PY = 10;
  const chartW = W - PX * 2, chartH = H - PY * 2;
  const vals = points.map(p => p.dbn);
  const minV = Math.min(...vals) * 0.95;
  const maxV = Math.max(...vals) * 1.05;
  const range = maxV - minV || 1;

  const getX = i => PX + (i / (points.length - 1)) * chartW;
  const getY = v => PY + chartH - ((v - minV) / range) * chartH;

  // Build SVG path
  let pathD = "";
  let areaD = "";
  const dots = [];
  points.forEach((p, i) => {
    const x = getX(i);
    const y = getY(p.dbn);
    if (i === 0) { pathD += `M ${x} ${y}`; areaD += `M ${x} ${H - PY}`; }
    else pathD += ` L ${x} ${y}`;
    areaD += ` L ${x} ${y}`;
    dots.push({ x, y, dbn: p.dbn, date: p.date, d: p.d });
  });
  areaD += ` L ${getX(points.length - 1)} ${H - PY} Z`;

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;margin-top:8px">`;
  // Area fill
  svg += `<path d="${areaD}" fill="url(#chartGrad)" opacity="0.3"/>`;
  svg += `<defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>`;
  // Grid lines
  for (let i = 0; i <= 3; i++) {
    const y = PY + (i / 3) * chartH;
    const val = maxV - (i / 3) * range;
    svg += `<line x1="${PX}" y1="${y}" x2="${W - PX}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>`;
    svg += `<text x="${PX - 4}" y="${y + 3}" fill="#475569" font-size="7" text-anchor="end">${Math.round(val)}</text>`;
  }
  // Line
  svg += `<path d="${pathD}" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  // Dots + labels
  dots.forEach((d, i) => {
    svg += `<circle cx="${d.x}" cy="${d.y}" r="3" fill="#22c55e" stroke="#0b0e18" stroke-width="1.5"/>`;
    // Date labels (show first, last, and middle)
    if (i === 0 || i === dots.length - 1 || (dots.length > 4 && i === Math.floor(dots.length / 2))) {
      svg += `<text x="${d.x}" y="${H - 2}" fill="#475569" font-size="7" text-anchor="middle">${fD(d.date)}</text>`;
    }
    // Value on first and last
    if (i === 0 || i === dots.length - 1) {
      svg += `<text x="${d.x}" y="${d.y - 6}" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle">${Math.round(d.dbn)}₺</text>`;
    }
  });
  svg += `</svg>`;

  // Summary below chart
  const first = points[0], last = points[points.length - 1];
  const change = first.dbn > 0 ? ((last.dbn - first.dbn) / first.dbn * 100) : 0;
  const totalD = points.reduce((s, p) => s + p.d, 0);

  let summary = `<div style="display:flex;justify-content:space-between;padding:6px 0 0;font-size:11px">`;
  summary += `<span style="color:#64748b">${points.length} gün · ${totalD} demet</span>`;
  summary += `<span style="color:${change > 0 ? '#34d399' : change < 0 ? '#f87171' : '#64748b'};font-weight:600">${change > 0 ? '▲ +' : '▼ '}${Math.abs(change).toFixed(1)}% dm başı net</span>`;
  summary += `</div>`;

  return svg + summary;
}

            var diff = actualNet - plan.estimatedNet;
            var diffPct = plan.estimatedNet > 0 ? (diff / plan.estimatedNet * 100) : 0;

            html += `<div><div style="font-size:9px;color:#64748b">Gerçekleşen${actualDate && actualDate !== plan.date ? ' ('+fD(actualDate)+')' : ''}</div><div style="font-size:14px;font-weight:700;color:#4ade80">${fmt(actualNet)}</div><div style="font-size:9px;color:#475569">planlanan çiçekler</div></div>`;
            html += `<div><div style="font-size:9px;color:#64748b">Fark</div><div style="font-size:14px;font-weight:700;color:${diff>=0?'#34d399':'#f87171'}">${diff>=0?'+':''}${fmt(diff)} (${diffPct>=0?'+':''}${diffPct.toFixed(0)}%)</div></div>`;
            html += `</div>`;
            if (dayTotalNet > actualNet) {
              html += `<div style="font-size:11px;color:#64748b;padding:4px 0;border-top:1px solid rgba(255,255,255,0.04);margin-top:4px">Günün toplam net: <span style="color:#4ade80;font-weight:600">${fmt(dayTotalNet)}</span> <span style="color:#475569">(tüm çiçekler)</span></div>`;
            }
          } else {
            html += `<div><div style="font-size:9px;color:#64748b">Gerçekleşen</div><div style="font-size:12px;color:#475569">Henüz veri yok</div></div>`;
          }
          html += `</div>`;
        }

        // Toggle details
        if (state.expanded["plan_"+realIdx]) {
          var detailHTML = esc(plan.result).replace(/\*\*(.*?)\*\*/g, '<strong style="color:#f8fafc">$1</strong>').replace(/\n/g, '<br>');
          html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.04);font-size:11px;color:#94a3b8;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch">${detailHTML}</div>`;
          html += `<button onclick="savedPlanPDF(${realIdx})" style="margin-top:6px;padding:6px 12px;border-radius:6px;border:none;background:rgba(34,197,94,0.12);color:#6ee7b7;font-size:10px;cursor:pointer;font-weight:600">📄 PDF Çıktı Al</button>`;
        }
        html += `<button onclick="toggleExp('plan_${realIdx}')" style="background:none;border:none;color:#475569;font-size:10px;cursor:pointer;padding-top:4px">${state.expanded["plan_"+realIdx]?'Detayı gizle ▲':'Detayı göster ▼'}</button>`;
        html += `</div>`;
      });
      if (savedPlans.length > 3) html += `<button class="show-more" onclick="toggleExp('allPlans')">${state.expanded.allPlans?'Daha az ▲':'Tüm planlar ('+savedPlans.length+') ▼'}</button>`;
    }
  }

  // ══ ŞUBE TABLOSU ══
  if (state.tab === "sube") {
    html += `<div class="sec-title">Şube Performans Karşılaştırması</div>`;
    html += `<div style="font-size:12px;color:#94a3b8;margin-bottom:14px;margin-top:-6px">Tüm şubeleri yan yana karşılaştır · Önceki döneme göre değişim dahil</div>`;

    // Build branch performance data
    const brPerf = {};
    filtered.forEach(r => {
      if (!brPerf[r.s]) brPerf[r.s] = { net: 0, d: 0, ciro: 0, records: 0 };
      brPerf[r.s].net += r.net;
      brPerf[r.s].d += r.d;
      brPerf[r.s].ciro += r.ciro;
      brPerf[r.s].records += 1;
    });
    const brList = Object.entries(brPerf).map(([name, v]) => ({
      name, ...v,
      dbn: v.d > 0 ? v.net / v.d : 0,
      avgP: v.d > 0 ? v.ciro / v.d : 0,
    })).sort((a, b) => b.net - a.net);

    // Önceki dönem hesapla (delta için)
    const prevBrPerf = {};
    const filteredDates = [...new Set(filtered.map(r => r.t))].sort();
    const gunSayisiSube = filteredDates.length;
    const prevDatesAll = [...new Set(ALL_DATA.filter(r => r.t < (filteredDates[0]||state.sd)).map(r => r.t))].sort().reverse().slice(0, Math.max(gunSayisiSube, 1));
    ALL_DATA.filter(r => prevDatesAll.includes(r.t)).forEach(r => {
      if (!prevBrPerf[r.s]) prevBrPerf[r.s] = { net: 0, d: 0 };
      prevBrPerf[r.s].net += r.net; prevBrPerf[r.s].d += r.d;
    });

    const topNet = brList[0]?.net || 1;
    const totalNet = brList.reduce((s, b) => s + b.net, 0);
    const totalDm = brList.reduce((s, b) => s + b.d, 0);

    // Table header
    html += `<div class="card" style="padding:0;overflow:hidden;overflow-x:auto">`;
    html += `<table style="width:100%;border-collapse:collapse;font-size:11px;min-width:420px">`;
    html += `<thead><tr style="border-bottom:1px solid rgba(255,255,255,0.08)">`;
    html += `<th style="padding:10px 6px;text-align:left;color:#64748b;font-size:9px;text-transform:uppercase;font-weight:600">Şube</th>`;
    html += `<th style="padding:10px 6px;text-align:right;color:#64748b;font-size:9px;text-transform:uppercase;font-weight:600">Net Gelir</th>`;
    html += `<th style="padding:10px 6px;text-align:right;color:#64748b;font-size:9px;text-transform:uppercase;font-weight:600">Dm Başı</th>`;
    html += `<th style="padding:10px 6px;text-align:right;color:#64748b;font-size:9px;text-transform:uppercase;font-weight:600">Demet</th>`;
    html += `<th style="padding:10px 4px;text-align:right;color:#64748b;font-size:9px;text-transform:uppercase;font-weight:600">Pay</th>`;
    html += `<th style="padding:10px 4px;text-align:right;color:#64748b;font-size:9px;text-transform:uppercase;font-weight:600">Δ</th>`;
    html += `</tr></thead><tbody>`;

    brList.forEach((b, i) => {
      const pct = totalNet > 0 ? (b.net / totalNet * 100) : 0;
      const barW = topNet > 0 ? (b.net / topNet * 100) : 0;
      const rowBg = i === 0 ? "rgba(34,197,94,0.06)" : i % 2 === 0 ? "rgba(255,255,255,0.02)" : "transparent";
      // Önceki dönem delta
      const prev = prevBrPerf[b.name];
      const prevNet = prev ? prev.net : 0;
      const prevDbn = prev && prev.d > 0 ? prev.net / prev.d : 0;
      const chNet = prevNet > 0 ? ((b.net - prevNet) / prevNet * 100) : null;
      html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);background:${rowBg}">`;
      html += `<td style="padding:8px 6px;color:#f8fafc;font-weight:${i===0?'600':'500'}">${i===0?'🏆 ':''}${esc(b.name)}</td>`;
      html += `<td style="padding:8px 6px;text-align:right"><div style="color:#34d399;font-weight:600">${fmt(b.net)}</div><div style="height:3px;background:rgba(255,255,255,0.04);border-radius:2px;margin-top:2px"><div style="height:100%;border-radius:2px;width:${barW}%;background:#22c55e"></div></div></td>`;
      html += `<td style="padding:8px 6px;text-align:right;color:#e2e8f0;font-weight:600">${fmt(b.dbn)}</td>`;
      html += `<td style="padding:8px 6px;text-align:right;color:#cbd5e1">${b.d}</td>`;
      html += `<td style="padding:8px 4px;text-align:right;color:#94a3b8;font-size:10px">${pct.toFixed(0)}%</td>`;
      html += `<td style="padding:8px 4px;text-align:right;font-size:10px;color:${chNet!==null?(chNet>=0?'#34d399':'#f87171'):'#475569'}">${chNet!==null?(chNet>=0?'+':'')+chNet.toFixed(0)+'%':'—'}</td>`;
      html += `</tr>`;
    });

    // Totals row
    html += `<tr style="border-top:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03)">`;
    html += `<td style="padding:10px 6px;color:#f8fafc;font-weight:700">TOPLAM</td>`;
    html += `<td style="padding:10px 6px;text-align:right;color:#4ade80;font-weight:700">${fmt(totalNet)}</td>`;
    html += `<td style="padding:10px 6px;text-align:right;color:#f8fafc;font-weight:700">${totalDm > 0 ? fmt(totalNet / totalDm) : '—'}</td>`;
    html += `<td style="padding:10px 6px;text-align:right;color:#f8fafc;font-weight:700">${totalDm}</td>`;
    html += `<td style="padding:10px 4px;text-align:right;color:#f8fafc;font-weight:700">100%</td>`;
    html += `<td></td>`;
    html += `</tr>`;

    html += `</tbody></table></div>`;

    // Per-branch flower breakdown — pay % + güven uyarısı eklendi
    html += `<div class="sec-title" style="margin-top:20px">Şube × Çiçek Detayı</div>`;
    const brFlower = {};
    filtered.forEach(r => {
      const key = r.s;
      if (!brFlower[key]) brFlower[key] = {};
      if (!brFlower[key][r.c]) brFlower[key][r.c] = { net: 0, d: 0 };
      brFlower[key][r.c].net += r.net;
      brFlower[key][r.c].d += r.d;
    });

    brList.slice(0, state.expanded.subeDetail ? 999 : 5).forEach((b, i) => {
      const flowers = brFlower[b.name] || {};
      const fList = Object.entries(flowers).map(([n, v]) => ({ name: n, ...v, dbn: v.d > 0 ? v.net / v.d : 0 })).sort((a, bb) => bb.dbn - a.dbn);
      const subeToplamNet = fList.reduce((s, fl) => s + fl.net, 0);

      html += `<div class="card" style="margin-bottom:8px;padding:12px 14px">`;
      html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">`;
      html += `<div style="font-size:13px;font-weight:600;color:#f8fafc">${esc(b.name)}</div>`;
      html += `<div style="font-size:9px;color:#64748b">${fList.length} çiçek · ${b.records} kayıt</div>`;
      html += `</div>`;
      fList.slice(0, 5).forEach((fl, j) => {
        const flPay = subeToplamNet > 0 ? (fl.net / subeToplamNet * 100) : 0;
        const guvenUyari = fl.d < 5 ? ' <span style="color:#f87171;font-size:8px">⚠ az örnek</span>' : fl.d < 15 ? ' <span style="color:#fbbf24;font-size:8px">◐ orta</span>' : '';
        html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-top:${j>0?'1px solid rgba(255,255,255,0.03)':'none'}">`;
        html += `<span style="font-size:11px;color:#cbd5e1">${esc(fl.name)}${guvenUyari}</span>`;
        html += `<span style="font-size:11px"><span style="color:#fbbf24;font-size:9px">%${flPay.toFixed(0)}</span> · <span style="color:#64748b">${fl.d}dm</span> · <span style="color:#34d399;font-weight:600">${fmt(fl.dbn)}/dm</span></span>`;
        html += `</div>`;
      });
      if (fList.length > 5) html += `<div style="font-size:10px;color:#475569;padding-top:4px">+${fList.length - 5} çiçek daha</div>`;
      html += `</div>`;
    });
    if (brList.length > 5) html += `<button class="show-more" onclick="toggleExp('subeDetail')">${state.expanded.subeDetail?'Daha az ▲':'Tüm şubeler ('+brList.length+') ▼'}</button>`;
  }

  // ══ KARŞILAŞTIR ══
  if (state.tab === "compare") {
    const bc = getBranchComp(filtered);
    // 2+ şubeli ve tek şubeli ayır
    const bcMulti = bc.filter(item => item.branchCount >= 2);
    const bcSingle = bc.filter(item => item.branchCount < 2);

    html += `<div class="sec-title">Aynı Çiçek — Farklı Şubeler</div>`;
    html += `<div style="font-size:12px;color:#94a3b8;margin-bottom:14px;margin-top:-6px">Dm başı net karşılaştırma · Fiyat farkı + karar etkisi · Güven seviyesi</div>`;
    const compShow = state.expanded.comp ? 999 : 5;
    bcMulti.slice(0, compShow).forEach((item, i) => {
      const best = item.branches[0];
      const worst = item.branches[item.branches.length - 1];
      const mx = best?.dbn || 1;
      const fark = best && worst ? (best.dbn - worst.dbn) : 0;
      const kararEtkisi = fark * item.totalD;
      const show = state.expanded["comp_"+i] ? 999 : 5;

      html += `<div class="card" style="margin-bottom:12px">`;
      // Başlık + fiyat farkı + karar etkisi
      html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div style="font-size:13px;font-weight:700;color:#f8fafc">${esc(item.flower)}</div><div style="font-size:10px;color:#34d399">${item.branchCount} şube · ${item.totalD}dm</div></div>`;
      if (fark > 0 && item.branches.length >= 2) {
        html += `<div style="display:flex;gap:10px;margin-bottom:8px;font-size:10px">`;
        html += `<span style="color:#fbbf24">Fark: ${fmt(fark)}/dm</span>`;
        html += `<span style="color:#c4b5fd">Karar etkisi: ~${fmt(kararEtkisi)}</span>`;
        html += `</div>`;
      }
      // Şube satırları
      item.branches.slice(0, show).forEach((b, j) => {
        const w = mx > 0 ? (b.dbn / mx * 100) : 0;
        const isBest = j === 0;
        // Güven etiketi
        const guvenTxt = b.d < 5 ? '<span style="color:#f87171;font-size:7px"> ⚠az</span>' : b.d < 15 ? '<span style="color:#fbbf24;font-size:7px"> ◐</span>' : '';
        // Trend ok
        const trendOk = b.trend > 5 ? '<span style="color:#34d399;font-size:8px">↑</span>' : b.trend < -5 ? '<span style="color:#f87171;font-size:8px">↓</span>' : '<span style="color:#475569;font-size:8px">→</span>';
        html += `<div style="display:flex;align-items:center;gap:4px;padding:4px 0;border-top:${j>0?'1px solid rgba(255,255,255,0.03)':'none'}">`;
        html += `<div style="width:55px;font-size:10px;color:${isBest?'#34d399':'#94a3b8'};font-weight:${isBest?600:400};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</div>`;
        html += `<div style="flex:1;height:5px;background:rgba(255,255,255,0.04);border-radius:3px"><div style="height:100%;border-radius:3px;width:${w}%;background:${isBest?'linear-gradient(90deg,#22c55e,#34d399)':'rgba(148,163,184,0.25)'}"></div></div>`;
        html += `<div style="width:50px;text-align:right;font-size:12px;font-weight:700;color:${isBest?'#34d399':'#cbd5e1'}">${fmt(b.dbn)}</div>`;
        html += `<div style="width:35px;text-align:right;font-size:9px;color:#64748b">${b.d}dm${guvenTxt}</div>`;
        html += `<div style="width:12px;text-align:center">${trendOk}</div>`;
        html += `</div>`;
      });
      if (item.branches.length > 5) html += `<button style="margin-top:4px;background:none;border:none;color:#64748b;font-size:10px;cursor:pointer" onclick="toggleExp('comp_${i}')">${state.expanded["comp_"+i]?"Daha az":"+"+(item.branches.length-5)+" şube daha"}</button>`;
      html += `</div>`;
    });
    if (bcMulti.length > 5) html += `<button class="show-more" onclick="toggleExp('comp')">${state.expanded.comp?'Daha az ▲':'Tüm çiçekler ('+bcMulti.length+') ▼'}</button>`;

    // Tek şubeli ürünler — ayrı bölüm
    if (bcSingle.length > 0) {
      html += `<div class="sec-title" style="margin-top:16px;color:#475569">Tek Şubeli Ürünler</div>`;
      html += `<div style="font-size:10px;color:#475569;margin-bottom:8px;margin-top:-6px">Karşılaştırma için yeterli şube verisi yok</div>`;
      html += `<div class="card" style="padding:10px">`;
      bcSingle.slice(0, state.expanded.compSingle ? 999 : 5).forEach((item, j) => {
        const b = item.branches[0];
        if (!b) return;
        html += `<div style="display:flex;justify-content:space-between;padding:3px 0;border-top:${j>0?'1px solid rgba(255,255,255,0.03)':'none'};font-size:10px">`;
        html += `<span style="color:#64748b">${esc(item.flower)}</span>`;
        html += `<span style="color:#475569">${esc(b.name)} · ${b.d}dm · ${fmt(b.dbn)}/dm</span>`;
        html += `</div>`;
      });
      if (bcSingle.length > 5) html += `<button style="margin-top:4px;background:none;border:none;color:#475569;font-size:9px;cursor:pointer" onclick="toggleExp('compSingle')">${state.expanded.compSingle?'Daha az':'+'+(bcSingle.length-5)+' ürün daha'}</button>`;
      html += `</div>`;
    }
  }

  // ══ KAR HARİTASI ══
  if (state.tab === "heat") {
    const hd = getHeatData(filtered);
    html += `<div class="sec-title">En Kârlı Kombinasyonlar</div>`;
    html += `<div style="display:flex;gap:6px;margin-bottom:14px">`;
    [["net","Demet Başı Net"],["price","Ort. Fiyat"]].forEach(([k,l]) => {
      html += `<button class="preset-btn ${state.hmSort===k?'active':''}" onclick="setState({hmSort:'${k}'})">${l}</button>`;
    });
    html += `</div>`;
    const hShow = state.expanded.heat ? 999 : 15;
    const mx = hd[0] ? (state.hmSort === "net" ? hd[0].dbn : hd[0].avgP) : 1;
    hd.slice(0, hShow).forEach((h, i) => {
      const v = state.hmSort === "net" ? h.dbn : h.avgP;
      const pct = mx > 0 ? (v / mx) * 100 : 0;
      const intensity = pct / 100;
      const colors = ["#fbbf24","#cbd5e1","#c49a6c"];
      html += `<div class="heat-row"><div style="width:20px;text-align:center;font-size:10px;font-weight:700;color:${i<3?colors[i]:'#475569'}">${i+1}</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.cicek)}</div><div style="font-size:10px;color:#64748b">${esc(h.sube)} · ${h.d}dm</div></div><div style="width:80px"><div style="height:6px;background:rgba(255,255,255,0.04);border-radius:3px"><div style="height:100%;border-radius:3px;width:${pct}%;background:rgba(34,197,94,${(0.3+intensity*0.5).toFixed(2)})"></div></div></div><div style="width:60px;text-align:right;font-size:13px;font-weight:700;color:rgba(52,211,153,${(0.5+intensity*0.5).toFixed(2)})">${fmt(v)}</div></div>`;
    });
    if (hd.length > 15) html += `<button class="show-more" style="margin-top:8px" onclick="toggleExp('heat')">${state.expanded.heat?'Daha az ▲':'Tümü ('+hd.length+' kombo) ▼'}</button>`;
  }

  // ══ TABLO ══
  if (state.tab === "tablo") {
    html += `<div class="sec-title">Kayıtlar (${filtered.length})</div>`;
    html += `<div class="card" style="padding:0;overflow:hidden">`;
    html += `<div class="tbl-head tbl-cols"><span>Tarih</span><span>Çiçek</span><span>Şube</span><span style="text-align:center">Dm</span><span style="text-align:right">Fiyat</span><span style="text-align:right">Net</span></div>`;
    html += `<div style="max-height:450px;overflow-y:auto">`;
    const sorted = [...filtered].sort((a, b) => b.t.localeCompare(a.t) || b.f - a.f);
    sorted.slice(0, 200).forEach(r => {
      html += `<div class="tbl-row tbl-cols"><span style="color:#64748b;font-size:10px">${fD(r.t)}</span><span style="color:#e2e8f0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.c)}</span><span style="color:#94a3b8;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.s)}</span><span style="color:#cbd5e1;text-align:center">${r.d}</span><span style="color:#f8fafc;font-weight:600;text-align:right">${r.f.toFixed(0)}</span><span style="color:#34d399;font-weight:600;text-align:right">${r.dbn.toFixed(0)}</span></div>`;
    });
    if (sorted.length > 200) html += `<div style="text-align:center;padding:12px;color:#64748b;font-size:11px">İlk 200 kayıt gösteriliyor (toplam ${sorted.length})</div>`;
    html += `</div></div>`;
    if (!filtered.length) html += `<div style="text-align:center;padding:40px;color:#475569">Kayıt bulunamadı.</div>`;
  }

  // ══ GEÇEN YIL ══
  if (state.tab === "yoy") {
    const y = getYoY(filtered);
    html += `<div class="sec-title">Geçen Yıl Karşılaştırması</div>`;
    if (!y.has) {
      html += `<div class="card" style="background:rgba(250,204,21,0.06);border-color:rgba(250,204,21,0.12);text-align:center;padding:30px"><div style="font-size:14px;color:#fbbf24;margin-bottom:6px">Geçen yıl verisi yok</div><div style="font-size:12px;color:#94a3b8">Tarih aralığını "7 Gün" veya "Bu Ay" olarak değiştirip tekrar dene.</div></div>`;
    } else {
      // Top KPIs - NET based
      html += `<div class="grid-2" style="margin-bottom:14px">`;
      html += `<div class="card"><div style="font-size:10px;color:#64748b;margin-bottom:4px">2025 Net Gelir</div><div style="font-size:18px;font-weight:800;color:#94a3b8">${fmt(y.lN)}</div><div style="font-size:10px;color:#475569;margin-top:3px">${y.lD} demet · ${fmt(y.lA)} dm başı</div></div>`;
      html += `<div class="card card-green"><div style="font-size:10px;color:#64748b;margin-bottom:4px">2026 Net Gelir</div><div style="font-size:18px;font-weight:800;color:#4ade80">${fmt(y.tN)}</div><div style="font-size:10px;color:#475569;margin-top:3px">${y.tD} demet · ${fmt(y.tA)} dm başı</div></div>`;
      html += `</div>`;

      // Change summary
